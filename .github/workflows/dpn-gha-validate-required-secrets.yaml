name: DPN CD - Validate Required Secrets

# Runs before Kafka in the health-monitoring installer (ADO:
# validate-required-secrets-cd.yaml). Fails fast when a secret a component needs is
# missing, instead of a FailedMount / CreateContainerConfigError deep inside a later stage.

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      cluster:
        required: true
        type: string
      cloud:
        required: true
        type: string
      ACR_NAME:
        required: true
        type: string
      IMAGE_REGISTRY:
        required: true
        type: string
      AZURE_SUBSCRIPTION_ID:
        required: true
        type: string
      RESOURCE_GROUP:
        required: true
        type: string
      AKS_CLUSTER:
        required: true
        type: string
      KEY_VAULT_NAME:
        required: true
        type: string
      NAMESPACE:
        required: true
        type: string
      ARM_SUBSCRIPTION_ID:
        required: true
        type: string
      AWS_REGION:
        required: false
        type: string
      AWS_ACCOUNT_ID:
        required: false
        type: string
      EKS_CLUSTER:
        required: false
        type: string

permissions:
  id-token: write
  contents: read

env:
  HUB_ROLE_ARN: <<your specific value>>

jobs:
  validate:
    name: Validate required secrets
    runs-on: [self-hosted, vmss]
    environment: ${{ inputs.environment }}-${{ inputs.cluster }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Export Config as Env Vars
        shell: bash
        run: |
          echo "ACR_NAME=${{ inputs.ACR_NAME }}" >> "$GITHUB_ENV"
          echo "IMAGE_REGISTRY=${{ inputs.IMAGE_REGISTRY }}" >> "$GITHUB_ENV"
          echo "AZURE_SUBSCRIPTION_ID=${{ inputs.AZURE_SUBSCRIPTION_ID }}" >> "$GITHUB_ENV"
          echo "RESOURCE_GROUP=${{ inputs.RESOURCE_GROUP }}" >> "$GITHUB_ENV"
          echo "AKS_CLUSTER=${{ inputs.AKS_CLUSTER }}" >> "$GITHUB_ENV"
          echo "KEY_VAULT_NAME=${{ inputs.KEY_VAULT_NAME }}" >> "$GITHUB_ENV"
          echo "NAMESPACE=${{ inputs.NAMESPACE }}" >> "$GITHUB_ENV"
          echo "ARM_SUBSCRIPTION_ID=${{ inputs.ARM_SUBSCRIPTION_ID }}" >> "$GITHUB_ENV"
          echo "AWS_REGION=${{ inputs.AWS_REGION }}" >> "$GITHUB_ENV"
          echo "AWS_ACCOUNT_ID=${{ inputs.AWS_ACCOUNT_ID }}" >> "$GITHUB_ENV"
          echo "EKS_CLUSTER=${{ inputs.EKS_CLUSTER }}" >> "$GITHUB_ENV"

      - name: Cloud Login
        uses: ./.github/actions/cloud-login
        with:
          cloud: ${{ inputs.cloud }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          aws-region: ${{ env.AWS_REGION }}
          aws-account-id: ${{ env.AWS_ACCOUNT_ID }}
          eks-cluster: ${{ env.EKS_CLUSTER }}

      # Parity with ADO validate-required-secrets-cd.yaml. Only EXISTENCE is checked,
      # never the value. This catches the FailedMount / DeadlineExceeded class of
      # failure (a missing or misnamed Key Vault object) before the stage that needs
      # it times out on a helm upgrade --wait, instead of after.
      - name: Check Required Key Vault Secrets Exist
        if: ${{ inputs.cloud == 'azure' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "KEY_VAULT_NAME=$KEY_VAULT_NAME"
          echo "NAMESPACE=$NAMESPACE"

          az account set --subscription "$AZURE_SUBSCRIPTION_ID"

          echo "========================================"
          echo "Every Key Vault secret a component syncs directly must already exist"
          echo "========================================"
          # Everything else in this stack either has no Key Vault secret of its own
          # (OTel Collector, Perses, Prometheus, Thanos, dpn-portal) or reuses a Secret
          # another component already synced, so there is nothing to check for those
          # beyond what their upstream component already covers. TRUSTSTORE-PASSWORD is
          # not in this map: kafka-stack and data-prepper read it from tls-auth-secret.
          declare -A SECRET_CONSUMER=(
            [KC-SERVICE-CLIENT-SECRET]="kafka-stack + every oauth2-proxy release"
            [KC-OPENSEARCH-ADMIN-PASSWORD]="opensearch (opensearch-oidc-kv-secretproviderclass)"
            [KC-OPENSEARCH-KIBANASERVER-PASSWORD]="opensearch (opensearch-oidc-kv-secretproviderclass)"
            [KC-OPENSEARCH-DATAWRITER-PASSWORD]="opensearch (opensearch-oidc-kv-secretproviderclass)"
          )

          MISSING=0
          for SECRET_NAME in "${!SECRET_CONSUMER[@]}"; do
            if az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name "$SECRET_NAME" --query id -o tsv >/dev/null 2>&1; then
              echo "  [OK]      $SECRET_NAME (${SECRET_CONSUMER[$SECRET_NAME]})"
            else
              echo "::error::  [MISSING] $SECRET_NAME (${SECRET_CONSUMER[$SECRET_NAME]}) not found in $KEY_VAULT_NAME"
              MISSING=1
            fi
          done

          if [ "$MISSING" -eq 1 ]; then
            echo "::error::One or more secrets a DPN component syncs directly from Key Vault are missing from $KEY_VAULT_NAME."
            echo "::error::These are provisioned manually as part of Keycloak's own setup (see dpn-authentication-service), not by this workflow."
            exit 1
          fi

          echo ""
          echo "All required secrets present in $KEY_VAULT_NAME."

      # AWS equivalent of the Key Vault check above: the three OpenSearch passwords
      # the opensearch-oidc SecretProviderClass reads from Secrets Manager under
      # secretsManager.secretPrefix (dpn/<env>-<cluster>/opensearch). Only EXISTENCE
      # is checked (describe-secret), never the value. No workflow creates these;
      # they are set by hand.
      - name: Check Required Secrets Manager Secrets Exist
        if: ${{ inputs.cloud == 'aws' }}
        shell: bash
        env:
          TARGET_ENV: ${{ inputs.environment }}
          TARGET_CLUSTER: ${{ inputs.cluster }}
        run: |
          set -euo pipefail

          PREFIX="dpn/${TARGET_ENV}-${TARGET_CLUSTER}/opensearch"
          echo "Checking Secrets Manager objects under $PREFIX (region $AWS_REGION)"

          MISSING=0
          for NAME in ADMIN_PASSWORD KIBANASERVER_PASSWORD DATAWRITER_PASSWORD; do
            SECRET_ID="$PREFIX/$NAME"
            if aws secretsmanager describe-secret --secret-id "$SECRET_ID" --region "$AWS_REGION" >/dev/null 2>&1; then
              echo "  [OK]      $SECRET_ID (opensearch-oidc-kv-secretproviderclass)"
            else
              echo "::error::  [MISSING] $SECRET_ID not found (or not readable by this role)"
              MISSING=1
            fi
          done

          if [ "$MISSING" -eq 1 ]; then
            echo "::error::One or more secrets OpenSearch reads from Secrets Manager are missing under $PREFIX."
            echo "::error::They are provisioned manually, not by this workflow. Create them (the same three passwords as the Azure KC-OPENSEARCH-* objects), then re-run."
            exit 1
          fi

          echo ""
          echo "All required secrets present under $PREFIX."

      # tls-auth-secret (KEYSTORE_PASSWORD / TRUSTSTORE_PASSWORD / DPN_CLIENT_P12_PASSWORD)
      # is created directly into this namespace by the TLS workflow, never by this one.
      # Kafka UI reads TRUSTSTORE_PASSWORD (kafka-stack/templates/zookeeper-kafka-lb.yaml)
      # and Data Prepper reads KEYSTORE_PASSWORD (data-prepper/templates/deployment.yaml),
      # neither marked optional. The risk is the TLS workflow simply not having been
      # (re)run against THIS environment yet; failing here gives one clear message
      # instead of the Kafka stage dying inside a CreateContainerConfigError.
      - name: Check tls-auth-secret Exists
        shell: bash
        run: |
          set -euo pipefail

          SECRET="tls-auth-secret"
          echo "Checking Secret '$SECRET' in namespace $NAMESPACE"

          MISSING=0
          for KEY in KEYSTORE_PASSWORD TRUSTSTORE_PASSWORD; do
            # The value is only captured to test it is non-empty; it is never printed.
            if ! VALUE_B64=$(kubectl get secret "$SECRET" -n "$NAMESPACE" -o "jsonpath={.data.$KEY}" 2>&1); then
              if grep -qi "notfound\|not found" <<<"$VALUE_B64"; then
                echo "::error::[MISSING] $SECRET not found in $NAMESPACE"
                echo "::error::Run dpn-gha-tls-cd (or dpn-gha-prerequisite-pipeline) against this environment first - it creates"
                echo "::error::$SECRET directly, it is never synced by this workflow."
              else
                echo "::error::Could not read Secret '$SECRET' in namespace $NAMESPACE (RBAC or cluster access?):"
                echo "$VALUE_B64"
              fi
              exit 1
            fi
            if [ -z "$VALUE_B64" ]; then
              echo "::error::[MISSING] $SECRET exists in $NAMESPACE but has no non-empty key '$KEY'"
              MISSING=1
            else
              echo "  [OK]      $SECRET/$KEY present in $NAMESPACE"
            fi
          done

          if [ "$MISSING" -eq 1 ]; then
            echo "::error::Re-run dpn-gha-tls-cd (or dpn-gha-prerequisite-pipeline) against this environment."
            exit 1
          fi
