# =============================================================================
# Nginx reverse proxy — DPN Observability UIs
# All six UIs are protected by HTTP Basic Auth (single admin credential).
# The .htpasswd file is mounted at /etc/nginx/.htpasswd inside the container.
# To regenerate the password:
#   htpasswd -nbB admin <new-password>  (replace the line in nginx/.htpasswd)
# =============================================================================

events {
  worker_connections 1024;
}

http {
  # -------------------------------------------------------------------------
  # Shared auth realm
  # -------------------------------------------------------------------------
  # auth_basic and auth_basic_user_file are declared per-server block below.

  # -------------------------------------------------------------------------
  # Kafka UI  →  http://localhost:8082
  # -------------------------------------------------------------------------
  server {
    listen 8082;
    server_name _;

    auth_basic           "DPN Observability";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
      proxy_pass         http://dpn-kafka-ui-health:8080;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_read_timeout 300s;
    }
  }

  # -------------------------------------------------------------------------
  # OpenSearch Dashboards  →  http://localhost:5601
  # -------------------------------------------------------------------------
  server {
    listen 5601;
    server_name _;

    auth_basic           "DPN Observability";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
      proxy_pass         http://dpn-opensearch-dashboards-health:5601;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_read_timeout 300s;
    }
  }

  # -------------------------------------------------------------------------
  # Jaeger UI  →  http://localhost:16686
  # -------------------------------------------------------------------------
  server {
    listen 16686;
    server_name _;

    auth_basic           "DPN Observability";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
      proxy_pass         http://dpn-jaeger-query-health:16686;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_read_timeout 300s;
    }
  }

  # -------------------------------------------------------------------------
  # Prometheus  →  http://localhost:9081
  # -------------------------------------------------------------------------
  server {
    listen 9081;
    server_name _;

    auth_basic           "DPN Observability";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
      proxy_pass         http://dpn-prometheus-health:9090;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_read_timeout 300s;
    }
  }

  # -------------------------------------------------------------------------
  # Thanos Query  →  http://localhost:9091
  # -------------------------------------------------------------------------
  server {
    listen 9091;
    server_name _;

    auth_basic           "DPN Observability";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
      proxy_pass         http://dpn-thanos-query-health:9091;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_read_timeout 300s;
    }
  }

  # -------------------------------------------------------------------------
  # Perses  →  http://localhost:8083
  # -------------------------------------------------------------------------
  server {
    listen 8083;
    server_name _;

    auth_basic           "DPN Observability";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
      proxy_pass         http://dpn-perses-health:8080;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_read_timeout 300s;
    }
  }
}
