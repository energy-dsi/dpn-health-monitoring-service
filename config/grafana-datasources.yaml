apiVersion: 1

datasources:
  # Prometheus datasource
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://dpn-prometheus-health:9090
    isDefault: false
    editable: true
    jsonData:
      timeInterval: "15s"

  # Thanos datasource (preferred for queries)
  - name: Thanos
    type: prometheus
    access: proxy
    url: http://dpn-thanos-query-health:9091
    isDefault: true
    editable: true
    jsonData:
      timeInterval: "15s"
      
  # Jaeger datasource for traces
  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://dpn-jaeger-query-health:16686
    editable: true
    
  # OpenSearch datasource for logs
  - name: OpenSearch Logs
    type: elasticsearch
    access: proxy
    url: http://dpn-opensearch-health:9200
    database: "otel-logs-*"
    editable: true
    jsonData:
      esVersion: "7.10.0"
      timeField: "@timestamp"
      logMessageField: "message"
      logLevelField: "severity"

