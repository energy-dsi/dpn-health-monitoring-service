namespace: ns-dpn-health-01

image:
  repository: thanosio/thanos
  tag: v0.34.0
  pullPolicy: IfNotPresent

query:
  name: dpn-thanos-query-health
  replicas: 1

  httpPort: 9091
  grpcPort: 10903

  service:
    # No OAuth2 gateway in front (Thanos Query is consumed through
    # Perses/Grafana, not browsed directly) but still needs a route in from
    # outside the cluster, so it publishes directly on the namespace's
    # shared internal LB address at the port nginx used to serve it.
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/azure-load-balancer-internal: "true"
    loadBalancerIP: <<your specific value>>

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

sidecar:
  serviceName: dpn-thanos-sidecar-health
  externalName: dpn-prometheus-kube-promet-thanos-discovery.ns-dpn-health-01.svc.cluster.local
  grpcPort: 10901
  httpPort: 10902

securityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534
