{{- if .Values.securityConfig.enabled }}
{{/*
Syncs the three OpenSearch internal-user passwords (admin/kibanaserver/
datawriter — bcrypt hashes of these already live in
opensearch-community-values.yaml's internal_users.yml) from Azure Key
Vault, so every consumer that needs basic-auth against OpenSearch
(OpenSearch Dashboards, data-prepper, the init jobs in
opensearch-dpn-health-resources.yaml — none of which are Helm-templated,
so they reference this Secret by its fixed name,
dpn-opensearch-health-oidc-secrets) can read the plaintext value without
it ever being committed.

Uses the same CSI driver / VM-managed-identity pattern already running for
oauth2-proxy in this namespace — see charts/oauth2-proxy/templates/
secretproviderclass.yaml for the reference this mirrors.
*/}}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "opensearch.uname" . }}-oidc-kv-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opensearch.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: {{ required "opensearchOidc.akv.userAssignedIdentityID is required" .Values.opensearchOidc.akv.userAssignedIdentityID | quote }}
    keyvaultName: {{ required "opensearchOidc.akv.keyvaultName is required" .Values.opensearchOidc.akv.keyvaultName | quote }}
    tenantId: {{ required "opensearchOidc.akv.tenantId is required" .Values.opensearchOidc.akv.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: KC-OPENSEARCH-ADMIN-PASSWORD
          objectType: secret
        - |
          objectName: KC-OPENSEARCH-KIBANASERVER-PASSWORD
          objectType: secret
        - |
          objectName: KC-OPENSEARCH-DATAWRITER-PASSWORD
          objectType: secret
  secretObjects:
  - secretName: {{ include "opensearch.uname" . }}-oidc-secrets
    type: Opaque
    data:
    - objectName: KC-OPENSEARCH-ADMIN-PASSWORD
      key: admin-password
    - objectName: KC-OPENSEARCH-KIBANASERVER-PASSWORD
      key: kibanaserver-password
    - objectName: KC-OPENSEARCH-DATAWRITER-PASSWORD
      key: datawriter-password
{{- end }}
