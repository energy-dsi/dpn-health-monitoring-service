
fullnameOverride: dpn-opensearch-health
masterService: dpn-opensearch-health


singleNode: true
replicas: 1

image:
  repository: "<<your specific value>>/opensearch"
  tag: "2.11.0"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-pull-secret

resources:
  requests:
    cpu: "1000m"
    memory: "2Gi"
  limits:
    cpu: "2000m"
    memory: "4Gi"

opensearchJavaOpts: "-Xms2g -Xmx2g"

persistence:
  enabled: true
  storageClass: "gp3"
  size: 100Gi
  enableInitChown: false

# -----------------------------------------------------------------------
# Security plugin — TLS (transport + HTTP) and admin/node identity.
# Mirrors charts/opensearch/values/aws/test-dpn01.yaml's pattern exactly:
# reuses dpn-health-tls (mounted below via extraVolumes/extraVolumeMounts),
# whose Subject DN (confirmed live via `openssl x509 -noout -subject` against
# the deployed cert: "C=GB, O=DSI, CN=dpn-common") is used for both admin_dn
# and nodes_dn below.
# -----------------------------------------------------------------------
config:
  opensearch.yml: |
    cluster.name: dpn-prod-observability
    network.host: 0.0.0.0

    plugins.security.ssl.transport.pemcert_filepath: certs/tls.crt
    plugins.security.ssl.transport.pemkey_filepath: certs/tls.key
    plugins.security.ssl.transport.pemtrustedcas_filepath: certs/ca.crt
    plugins.security.ssl.transport.enforce_hostname_verification: false

    plugins.security.ssl.http.enabled: true
    plugins.security.ssl.http.pemcert_filepath: certs/tls.crt
    plugins.security.ssl.http.pemkey_filepath: certs/tls.key
    plugins.security.ssl.http.pemtrustedcas_filepath: certs/ca.crt

    # First-boot only — see test-dpn01.yaml's equivalent comment for the
    # full rationale.
    plugins.security.allow_default_init_securityindex: true

    plugins.security.unsupported.restapi.allow_securityconfig_modification: true

    plugins.security.authcz.admin_dn:
      - "CN=dpn-common,O=DSI,C=GB"
    plugins.security.nodes_dn:
      - "CN=dpn-common,O=DSI,C=GB"

    plugins.security.audit.type: internal_opensearch
    plugins.security.enable_snapshot_restore_privilege: true
    plugins.security.check_snapshot_restore_write_privileges: true
    plugins.security.restapi.roles_enabled: ["all_access", "security_rest_api_access"]

    plugins.security.system_indices.enabled: true
    plugins.security.system_indices.indices:
      - ".plugins-ml-config"
      - ".opendistro-*"
      - ".opensearch-*"

    cluster.routing.allocation.disk.threshold_enabled: true
    cluster.routing.allocation.disk.watermark.low: 85%
    cluster.routing.allocation.disk.watermark.high: 90%
    cluster.routing.allocation.disk.watermark.flood_stage: 95%

    action.auto_create_index: true
    indices.query.bool.max_clause_count: 10000

# -----------------------------------------------------------------------
# Security config bundle — see test-dpn01.yaml's equivalent comment for the
# full rationale on dataComplete and the stub files below.
#
# Hashes below were generated 2026-10-13 via the opensearch pod's own
# plugins/opensearch-security/tools/hash.sh against freshly-generated
# passwords, which were stored as the plaintext values of
# dpn/dev-dpn01/opensearch/{ADMIN,KIBANASERVER,DATAWRITER}_PASSWORD in AWS
# Secrets Manager at the same time — hash and Secrets Manager value are
# confirmed matching as of this date. Regenerate both together if rotated.
# -----------------------------------------------------------------------
securityConfig:
  enabled: true
  config:
    dataComplete: true
    data:
      config.yml: |
        _meta:
          type: "config"
          config_version: 2

        config:
          dynamic:
            kibana:
              multitenancy_enabled: false
              server_username: kibanaserver
              index: ".kibana"
            http:
              anonymous_auth_enabled: false
              xff:
                enabled: true
                internalProxies: "127\\.0\\.0\\.1|10\\..*|192\\.168\\..*|172\\.(1[6-9]|2[0-9]|3[0-1])\\..*"
            authc:
              basic_internal_auth_domain:
                description: "HTTP Basic auth against the internal users database"
                http_enabled: true
                transport_enabled: true
                order: 0
                http_authenticator:
                  type: basic
                  challenge: false
                authentication_backend:
                  type: intern
              proxy_auth_domain:
                description: "Trusted-header auth from oauth2-proxy-osd via OSD proxycache"
                http_enabled: true
                transport_enabled: false
                order: 1
                http_authenticator:
                  type: proxy
                  challenge: false
                  config:
                    user_header: "x-forwarded-user"
                    roles_header: "x-forwarded-groups"
                    roles_separator: ","
                authentication_backend:
                  type: noop
              openid_auth_domain:
                description: "Bearer-JWT auth for direct :9200 API clients (Keycloak)"
                http_enabled: true
                transport_enabled: false
                order: 2
                http_authenticator:
                  type: openid
                  challenge: false
                  config:
                    subject_key: preferred_username
                    roles_key: roles
                    jwks_uri: https://dpn-keycloak.ns-dpn-01.svc.cluster.local:8443/realms/dpn-realm/protocol/openid-connect/certs
                    openid_connect_idp:
                      enable_ssl: true
                      verify_hostnames: false
                      pemtrustedcas_filepath: certs/ca.crt
                authentication_backend:
                  type: noop

      internal_users.yml: |
        _meta:
          type: "internalusers"
          config_version: 2

        admin:
          hash: "$2y$12$AXvQYO.ZrCTxYIQYNmdKru59EAia5tJWYwv9RzJFgo8lep/SF6dpi"
          reserved: true
          backend_roles:
            - "admin"
          description: "securityadmin / superuser account"

        kibanaserver:
          hash: "$2y$12$tnM41r8TGle06zwpWmDyIuM5vKB7Sh8XYQdJ9VYLy8x3UfLKtlRz."
          reserved: true
          description: "OpenSearch Dashboards backend service account"

        datawriter:
          hash: "$2y$12$lq9NfEb4/BCDJlwzGRxsbeZk4euS3tYsS3lHugj6HkMBWg8YI3tMG"
          reserved: false
          description: "Telemetry writers: data-prepper, init jobs"

      roles.yml: |
        _meta:
          type: "roles"
          config_version: 2

        dpn_readonly:
          reserved: false
          description: "Read-only access to DPN telemetry indices and dashboards"
          cluster_permissions:
            - "cluster_composite_ops_ro"
            - "cluster:monitor/*"
            - "cluster:admin/opensearch/observability/get"
            - "cluster:admin/opensearch/ql/datasources/read"
            - "cluster:admin/opendistro/ism/policy/search"
            - "cluster:admin/opendistro/ism/policy/get"
          index_permissions:
            - index_patterns:
                - "*"
              allowed_actions:
                - "indices:admin/get"
            - index_patterns:
                - "otel-*"
                - "otel-logs-*"
              allowed_actions:
                - "read"
                - "search"
                - "indices:monitor/*"
            - index_patterns:
                - ".kibana*"
                - ".opensearch_dashboards*"
              allowed_actions:
                - "read"
                - "search"
                - "indices:monitor/*"
      # No write grant on .kibana*/.opensearch_dashboards* for dpn_readonly:
      # see test-dpn01.yaml's equivalent comment for the full rationale.

      roles_mapping.yml: |
        _meta:
          type: "rolesmapping"
          config_version: 2

        all_access:
          reserved: false
          backend_roles:
            - "dpnadmin"
          users:
            - "admin"
            - "kibanaserver"
            - "datawriter"

        kibana_read_only:
          reserved: false
          backend_roles:
            - "dpnreader"

        dpn_readonly:
          reserved: false
          backend_roles:
            - "dpnreader"

      action_groups.yml: |
        _meta:
          type: "actiongroups"
          config_version: 2

      tenants.yml: |
        _meta:
          type: "tenants"
          config_version: 2

      nodes_dn.yml: |
        _meta:
          type: "nodesdn"
          config_version: 2

      whitelist.yml: |
        _meta:
          type: "whitelist"
          config_version: 2
        config:
          enabled: false

extraVolumes:
  - name: dpn-health-tls
    secret:
      secretName: dpn-health-tls
  # Not read by OpenSearch itself — mounting it is what makes the CSI
  # driver mirror the Secrets Manager values into the oidc-secrets Secret
  # that OSD/data-prepper/the init jobs read via secretKeyRef. See
  # templates/opensearch-oidc-kv-secretproviderclass.yaml.
  - name: oidc-kv-secrets-store
    csi:
      driver: secrets-store.csi.k8s.io
      readOnly: true
      volumeAttributes:
        secretProviderClass: dpn-opensearch-health-oidc-kv-secrets

extraVolumeMounts:
  - name: dpn-health-tls
    mountPath: /usr/share/opensearch/config/certs
    readOnly: true
  - name: oidc-kv-secrets-store
    mountPath: /mnt/oidc-secrets-store
    readOnly: true

# rbac.create: true makes the chart's own templates/serviceaccount.yaml
# create dpn-opensearch with the IRSA annotation below (via
# serviceAccountAnnotations), and makes the StatefulSet's pod spec actually
# reference it by name — the pod authenticates to the AWS Secrets Store CSI
# driver as this identity. Role created 2026-10-13, scoped to
# system:serviceaccount:ns-dpn-health-01:dpn-opensearch via its trust policy.
rbac:
  create: true
  serviceAccountName: "dpn-opensearch"
  serviceAccountAnnotations:
    eks.amazonaws.com/role-arn: "<<your specific value>>"

opensearchOidc:
  aws:
    secretsManager:
      secretPrefix: "dpn/dev-dpn01/opensearch"

service:
  type: ClusterIP
  httpPort: 9200
  transportPort: 9300

podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

antiAffinity: "soft"

prometheus:
  enabled: true