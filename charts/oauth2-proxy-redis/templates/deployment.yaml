apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: redis
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: redis
              containerPort: 6379

          # No AUTH configured. This holds only Keycloak session tokens for
          # nine internal-only proxies in the same namespace, never reachable
          # outside the cluster network — the same trust boundary the plain
          # ClusterIP Service below relies on.
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          # redis-server needs to write its runtime dir even with no
          # persistence configured; readOnlyRootFilesystem above requires
          # this be an explicit writable mount rather than the container's
          # own filesystem.
          volumeMounts:
            - name: data
              mountPath: /data

          resources:
{{ toYaml .Values.resources | indent 12 }}

      volumes:
        - name: data
          emptyDir: {}
