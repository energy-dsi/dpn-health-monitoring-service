{{- if and .Values.kafka.enabled .Values.kafkaUi.enabled (.Values.kafkaUi.oidcRbac | default dict).enabled }}
{{/*
Syncs from Azure Key Vault the one thing Kafka UI's own OIDC login needs that
isn't otherwise available in this namespace: KC-SERVICE-CLIENT-SECRET, the
dpn-service-client credential.

(The truststore.jks password used to be pulled here too, as TRUSTSTORE-PASSWORD
- but dpn-tls-cd already publishes that identical Key Vault value into this
namespace as tls-auth-secret/TRUSTSTORE_PASSWORD, so this chart now reads it
straight from there instead - see templates/zookeeper-kafka-lb.yaml.)

secretObjects mirrors the value into dpn-keycloak-shared-akv - the SAME shared
Secret name charts/oauth2-proxy's SecretProviderClass also targets (see its
templates/secretproviderclass.yaml / templates/_helpers.tpl
oauth2-proxy.akvSecretName). Kafka UI runs in the Kafka stage, which
monitoring-master-cd.yaml runs well before the OAuth2Proxy stage, so this
SecretProviderClass being mounted here is what actually creates
dpn-keycloak-shared-akv first, on a brand new environment - the oauth2-proxy
releases that come later just find it already there and keep its CSI sync
alive between them. This chart no longer keeps its own private copy of the
credential.

Uses the same CSI driver / VM-managed-identity pattern already running for
oauth2-proxy in this namespace — see charts/oauth2-proxy/templates/
secretproviderclass.yaml for the reference this mirrors.

The CSI driver only performs the mirror while some pod has this
SecretProviderClass mounted as a volume — see templates/zookeeper-kafka-lb.yaml.
*/}}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.kafkaUi.name }}-oidc-kv-secrets
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.kafkaUi.name }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: {{ required "kafkaUi.oidcRbac.akv.userAssignedIdentityID is required" .Values.kafkaUi.oidcRbac.akv.userAssignedIdentityID | quote }}
    keyvaultName: {{ required "kafkaUi.oidcRbac.akv.keyvaultName is required" .Values.kafkaUi.oidcRbac.akv.keyvaultName | quote }}
    tenantId: {{ required "kafkaUi.oidcRbac.akv.tenantId is required" .Values.kafkaUi.oidcRbac.akv.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: KC-SERVICE-CLIENT-SECRET
          objectType: secret
  secretObjects:
  - secretName: dpn-keycloak-shared-akv
    type: Opaque
    data:
    - objectName: KC-SERVICE-CLIENT-SECRET
      key: client-secret
{{- end }}
