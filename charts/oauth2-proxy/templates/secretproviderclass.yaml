{{- if eq .Values.cloudProvider "aws" }}
{{/*
Syncs the dpn-service-client Keycloak credential from AWS Secrets Manager
instead of a hand-made Secret. Uses the AWS Secrets Store CSI driver with the
pod's IRSA identity (see templates/serviceaccount.yaml).

secretObjects makes the CSI driver mirror the fetched value into a real
Kubernetes Secret, {{ include "oauth2-proxy.akvSecretName" . }}, under the key
`client-secret` — the exact key templates/deployment.yaml reads via
secretKeyRef, so the Deployment needs no separate change. The CSI driver only
performs that mirror while some pod has this SecretProviderClass mounted as a
volume, which is why the Deployment below also mounts it — see
templates/deployment.yaml.
*/}}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.name }}-kv-secrets
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.name }}
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "{{ required "secretsManager.secretPrefix is required" .Values.secretsManager.secretPrefix }}/{{ .Values.akv.objectName }}"
        objectType: "secretsmanager"
        objectAlias: "{{ .Values.akv.objectName }}"
  secretObjects:
  - secretName: {{ include "oauth2-proxy.akvSecretName" . | quote }}
    type: Opaque
    data:
    - objectName: {{ .Values.akv.objectName }}
      key: client-secret
{{- else }}
{{/*
Syncs the dpn-service-client Keycloak credential from Azure Key Vault instead
of a hand-made Secret. Uses the same CSI driver / provider-azure add-on and
VM-managed-identity auth already running on this cluster for every other
SecretProviderClass in ns-dpn-01 (kubectl get secretproviderclass -n ns-dpn-01
-o yaml).

secretObjects makes the CSI driver mirror the mounted value into a real
Kubernetes Secret, {{ include "oauth2-proxy.akvSecretName" . }}, under the key
`client-secret` — the exact key templates/deployment.yaml reads via
secretKeyRef, so the Deployment needs no separate change. The CSI driver only
performs that mirror while some pod has this SecretProviderClass mounted as a
volume, which is why the Deployment below also mounts it — see
templates/deployment.yaml.
*/}}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.name }}-kv-secrets
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.name }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: {{ required "akv.userAssignedIdentityID is required" .Values.akv.userAssignedIdentityID | quote }}
    keyvaultName: {{ required "akv.keyvaultName is required" .Values.akv.keyvaultName | quote }}
    tenantId: {{ required "akv.tenantId is required" .Values.akv.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: {{ .Values.akv.objectName }}
          objectType: secret
  secretObjects:
  - secretName: {{ include "oauth2-proxy.akvSecretName" . | quote }}
    type: Opaque
    data:
    - objectName: {{ .Values.akv.objectName }}
      key: client-secret
{{- end }}
