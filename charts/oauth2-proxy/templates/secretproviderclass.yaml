{{/*
Syncs the dpn-service-client Keycloak credential from Azure Key Vault instead
of the hand-made Secret described in README.md. Uses the same CSI driver /
provider-azure add-on and VM-managed-identity auth already running on this
cluster for dpn-keycloak-kv-secrets and federator-client-kv-secrets in
ns-dpn-01 — see those for the live pattern this mirrors
(kubectl get secretproviderclass -n ns-dpn-01 -o yaml).

secretObjects makes the CSI driver mirror the mounted value into a real
Kubernetes Secret, {{ include "oauth2-proxy.akvSecretName" . }} — a name SHARED
across every oauth2-proxy instance (see the helper's own comment), under the
key `client-secret` — the exact key templates/deployment.yaml reads via
secretKeyRef, so the Deployment needs no separate change. The CSI driver only
performs that mirror while some pod has this SecretProviderClass mounted as a
volume, which is why the Deployment below also mounts it — see
templates/deployment.yaml. Every instance runs its own copy of this
SecretProviderClass (this metadata.name stays per-instance so Helm releases
don't collide), but they all write the identical value into that one shared
Secret.
*/}}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.name }}-kv-secrets
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.name }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: {{ required "akv.userAssignedIdentityID is required" .Values.akv.userAssignedIdentityID | quote }}
    keyvaultName: {{ required "akv.keyvaultName is required" .Values.akv.keyvaultName | quote }}
    tenantId: {{ required "akv.tenantId is required" .Values.akv.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: {{ .Values.akv.objectName }}
          objectType: secret
  secretObjects:
  - secretName: {{ include "oauth2-proxy.akvSecretName" . | quote }}
    type: Opaque
    data:
    - objectName: {{ .Values.akv.objectName }}
      key: client-secret
