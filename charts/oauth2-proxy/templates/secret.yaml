{{/*
The ONLY Secret this chart owns, and it holds one generated value.

cookie-secret is the AES key oauth2-proxy encrypts the session cookie with.
oauth2-proxy refuses to start without it, but its value is meaningless outside
this pod — no other system needs to know it — so the chart generates it rather
than making it one more credential to carry around.

The Keycloak client credential is NOT here. It lives in its own Secret,
synced from Key Vault by the CSI driver (see templates/secretproviderclass.yaml
and the oauth2-proxy.akvSecretName helper) that this chart only reads, via
secretKeyRef in the Deployment. That separation is the point: helm deletes
every resource it owns when a release is rolled back or uninstalled, so a
chart-managed Secret carrying that credential would be destroyed by the first
failed deploy. A credential helm cannot recreate must be one helm does not own.

Generated ONCE and then reused: lookup reads the value back from the Secret a
previous release created, so `helm upgrade` does not mint a new key and log
everyone out. It is regenerated only on a genuinely fresh install, or if this
Secret is deleted by hand — which is also how to rotate it deliberately.

(During `helm template` there is no cluster to look up, so a throwaway value is
rendered. That output is only ever inspected, never applied.)
*/}}
{{- $cookie := randAlphaNum 32 -}}
{{- $existing := lookup "v1" "Secret" .Values.namespace (include "oauth2-proxy.cookieSecretName" .) -}}
{{- if $existing -}}
{{-   $previous := index (default dict $existing.data) "cookie-secret" -}}
{{-   if $previous -}}
{{-     $cookie = b64dec $previous -}}
{{-   end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "oauth2-proxy.cookieSecretName" . }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.name }}
type: Opaque
stringData:
  cookie-secret: {{ $cookie | quote }}
