{{- if and (eq .Values.cloudProvider "aws") .Values.serviceAccount.create }}
{{- if not (lookup "v1" "ServiceAccount" .Values.namespace .Values.serviceAccount.name) }}
# =============================================================================
# ServiceAccount — IRSA binding for the AWS Secrets Store CSI driver.
# The role ARN's trust policy must scope sts:AssumeRoleWithWebIdentity to
# system:serviceaccount:<namespace>:<this-name>.
#
# Shared by name across all four oauth2-proxy releases (opensearch, jaeger,
# perses, portal) — they all use the same IRSA role, so they need the same
# ServiceAccount identity. Helm otherwise refuses this: whichever release
# renders it FIRST becomes its sole owner, and every other release's
# `helm upgrade --install` then fails with "invalid ownership metadata"
# trying to manage a resource owned by a different release (confirmed live,
# 2026-09-10 — jaeger failed this way against osd's already-created SA).
#
# `lookup` here means only the first release to run ever declares this
# resource at all; every later release (regardless of order across runs)
# sees it already exists and skips rendering it entirely — never
# contending for ownership in the first place. `resource-policy: keep`
# on top means even the owning release's later upgrades (which, once this
# object exists, also skip re-declaring it via the same lookup) leave it
# alone rather than pruning it as "removed from the manifest".
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.name }}
  annotations:
    eks.amazonaws.com/role-arn: "{{ .Values.serviceAccount.irsaRoleArn }}"
    helm.sh/resource-policy: keep
{{- end }}
{{- end }}
