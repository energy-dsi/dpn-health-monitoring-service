apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.name }}
  annotations:
{{ toYaml .Values.service.annotations | indent 4 }}
spec:
  type: {{ .Values.service.type }}
  {{- if .Values.service.loadBalancerIP }}
  loadBalancerIP: <<your specific value>>
  {{- end }}
  selector:
    app: {{ .Values.name }}
  ports:
    # The TLS listener is the only one oauth2-proxy binds — see the note in
    # templates/configmap.yaml.
    - name: https
      port: {{ .Values.service.port }}
      targetPort: 4443
      protocol: TCP
