apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      securityContext:
{{ toYaml .Values.podSecurityContext | indent 8 }}
{{- if .Values.tls.enabled }}
      initContainers:
        # Converts dpn-tls's keystore.jks (JKS) into the PKCS12 file Data
        # Prepper's core server requires, and substitutes the real keystore
        # password (read from kafka-stack's already-synced Secret below, not
        # a Key Vault pull of its own) into a copy of data-prepper-config.yaml
        # - see that file and values.yaml's tls block for why neither step
        # can be done any earlier/statically.
        # Also substitutes the real datawriter password into a copy of
        # pipelines.yaml the same way - Data Prepper's ${env:...} substitution
        # does not resolve inside the opensearch sink plugin's password field,
        # so the three sinks in configmap.yaml carry a __DATAWRITER_PASSWORD__
        # placeholder instead.
        # Runs the SAME image as the main container so `keytool` (a JDK tool)
        # is guaranteed present - no extra image to maintain.
        - name: generate-tls-config
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
{{ toYaml .Values.containerSecurityContext | indent 12 }}
          command:
            - sh
            - -c
            - |
              set -e
              keytool -importkeystore \
                -srckeystore /dpn-tls/{{ .Values.tls.keystoreFile }} -srcstoretype JKS -srcstorepass "$KEYSTORE_PASSWORD" \
                -destkeystore /tls-generated/keystore.p12 -deststoretype PKCS12 -deststorepass "$KEYSTORE_PASSWORD" \
                -noprompt
              sed "s/__KEYSTORE_PASSWORD__/$KEYSTORE_PASSWORD/g" /configraw/data-prepper-config.yaml > /tls-generated/data-prepper-config.yaml
              sed "s/__DATAWRITER_PASSWORD__/$DATAWRITER_PASSWORD/g" /configraw/pipelines.yaml > /tls-generated/pipelines.yaml
          env:
            # The keystore.jks password, read straight from tls-auth-secret
            # (created once in this namespace by dpn-tls-cd, which also sets
            # the matching Key Vault object KEYSTORE-PASSWORD) - no per-chart
            # Key Vault pull needed.
            - name: KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tls-auth-secret
                  key: KEYSTORE_PASSWORD
            - name: DATAWRITER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dpn-opensearch-health-oidc-secrets
                  key: datawriter-password
          volumeMounts:
            - name: dpn-tls
              mountPath: /dpn-tls
              readOnly: true
            - name: config
              mountPath: /configraw/data-prepper-config.yaml
              subPath: data-prepper-config.yaml
            - name: config
              mountPath: /configraw/pipelines.yaml
              subPath: pipelines.yaml
            - name: tls-generated
              mountPath: /tls-generated
{{- end }}
      containers:
        - name: data-prepper
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
{{ toYaml .Values.containerSecurityContext | indent 12 }}
          ports:
            - name: http
              containerPort: 4900
          volumeMounts:
{{- if .Values.tls.enabled }}
            # Generated by the generate-tls-config init container above, with
            # the real datawriter password substituted in - see that
            # container's command.
            - name: tls-generated
              mountPath: /usr/share/data-prepper/pipelines/pipelines.yaml
              subPath: pipelines.yaml
            - name: tls-generated
              mountPath: /usr/share/data-prepper/config/data-prepper-config.yaml
              subPath: data-prepper-config.yaml
            - name: tls-generated
              mountPath: /tls-generated
{{- else }}
            - name: config
              mountPath: /usr/share/data-prepper/pipelines/pipelines.yaml
              subPath: pipelines.yaml
            - name: config
              mountPath: /usr/share/data-prepper/config/data-prepper-config.yaml
              subPath: data-prepper-config.yaml
{{- end }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ .Values.name }}
{{- if .Values.tls.enabled }}
        - name: dpn-tls
          secret:
            secretName: {{ .Values.tls.secretName }}
        - name: tls-generated
          emptyDir: {}
{{- end }}