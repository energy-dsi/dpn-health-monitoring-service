                add_when: "/resourceLogs/0/scopeLogs/0/logRecords/0/attributes/8/key == \"component.name\""
                overwrite_if_key_exists: false
              - key: "log.component"
                value_expression: "/resourceLogs/0/scopeLogs/0/logRecords/0/attributes/9/value/stringValue"
                add_when: "/resourceLogs/0/scopeLogs/0/logRecords/0/attributes/9/key == \"component.name\""
                overwrite_if_key_exists: false
              - key: "log.component"
                value_expression: "/resourceLogs/0/scopeLogs/0/logRecords/0/attributes/10/value/stringValue"
                add_when: "/resourceLogs/0/scopeLogs/0/logRecords/0/attributes/10/key == \"component.name\""
                overwrite_if_key_exists: false
              - key: "log.component"
                value_expression: "/resourceLogs/0/scopeLogs/0/logRecords/0/attributes/11/value/stringValue"
                add_when: "/resourceLogs/0/scopeLogs/0/logRecords/0/attributes/11/key == \"component.name\""
                overwrite_if_key_exists: false
              - key: "log.component"
