apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.name }}
data:
  # Placeholder password (__KEYSTORE_PASSWORD__) - the init container in
  # templates/deployment.yaml substitutes the real value (read from
  # tls-auth-secret, see that container's env block) and writes the result
  # to an emptyDir the main container mounts instead of this ConfigMap
  # directly for this one file - Data Prepper's core config loader has no
  # ${env:...} substitution support the way pipelines.yaml does.
  data-prepper-config.yaml: |
    {{- if .Values.tls.enabled }}
    ssl: true
    keyStoreFilePath: "/tls-generated/keystore.p12"
    keyStorePassword: "__KEYSTORE_PASSWORD__"
    privateKeyPassword: "__KEYSTORE_PASSWORD__"
    {{- else }}
    ssl: false
    {{- end }}
    serverPort: 4900

  pipelines.yaml: |
    otel-logs-pipeline:
      source:
        kafka:
          encryption:
            type: none
          bootstrap_servers:
{{- range .Values.kafka.brokers }}
            - "{{ . }}"
{{- end }}
          topics:
            - name: otel-logs
              group_id: data-prepper-logs-group-v2
              auto_offset_reset: earliest
          acknowledgments: true
      processor:
        - parse_json: {}
        # Extract scalar leaf values from the OTLP array structure into flat top-level
        # fields so that OpenSearch Dashboards Discover columns can display them.
        # ── Step 1: extract fields that have a fixed position ────────────────────
        - add_entries:
            entries:
              - key: "log.severity"
                value_expression: "/resourceLogs/0/scopeLogs/0/logRecords/0/severityText"
                add_when: "/resourceLogs/0/scopeLogs/0/logRecords/0/severityText != null"
              - key: "log.body"
                value_expression: "/resourceLogs/0/scopeLogs/0/logRecords/0/body/stringValue"
                add_when: "/resourceLogs/0/scopeLogs/0/logRecords/0/body/stringValue != null"
              - key: "log.event_name"
                value_expression: "/resourceLogs/0/scopeLogs/0/logRecords/0/attributes/0/value/stringValue"
                add_when: "/resourceLogs/0/scopeLogs/0/logRecords/0/attributes/0/value/stringValue != null"
              - key: "log.trace_id"
                value_expression: "/resourceLogs/0/scopeLogs/0/logRecords/0/traceId"
                add_when: "/resourceLogs/0/scopeLogs/0/logRecords/0/traceId != null"
              - key: "log.span_id"
                value_expression: "/resourceLogs/0/scopeLogs/0/logRecords/0/spanId"
                add_when: "/resourceLogs/0/scopeLogs/0/logRecords/0/spanId != null"
              - key: "log.scope"
                value_expression: "/resourceLogs/0/scopeLogs/0/scope/name"
                add_when: "/resourceLogs/0/scopeLogs/0/scope/name != null"
        # ── Step 2: find service.name in resource.attributes (position varies) ───
        - add_entries:
            entries:
              - key: "log.service"
                value_expression: "/resourceLogs/0/resource/attributes/0/value/stringValue"
                add_when: "/resourceLogs/0/resource/attributes/0/key == \"service.name\""
              - key: "log.service"
                value_expression: "/resourceLogs/0/resource/attributes/1/value/stringValue"
                add_when: "/resourceLogs/0/resource/attributes/1/key == \"service.name\""
                overwrite_if_key_exists: false
              - key: "log.service"
                value_expression: "/resourceLogs/0/resource/attributes/2/value/stringValue"
                add_when: "/resourceLogs/0/resource/attributes/2/key == \"service.name\""
                overwrite_if_key_exists: false
              - key: "log.service"
                value_expression: "/resourceLogs/0/resource/attributes/3/value/stringValue"
                add_when: "/resourceLogs/0/resource/attributes/3/key == \"service.name\""
                overwrite_if_key_exists: false
              - key: "log.service"
                value_expression: "/resourceLogs/0/resource/attributes/4/value/stringValue"
                add_when: "/resourceLogs/0/resource/attributes/4/key == \"service.name\""
                overwrite_if_key_exists: false
              - key: "log.service"
                value_expression: "/resourceLogs/0/resource/attributes/5/value/stringValue"
                add_when: "/resourceLogs/0/resource/attributes/5/key == \"service.name\""
                overwrite_if_key_exists: false
        # ── Step 3: find component.name / pipeline.role / pipeline.type /
        # pipeline.stage across attribute positions 0-14, first match wins.
        - add_entries:
            entries:
              - key: "log.component"
                value_expression: "/resourceLogs/0/resource/attributes/0/value/stringValue"
                add_when: "/resourceLogs/0/resource/attributes/0/key == \"component.name\" or /resourceLogs/0/resource/attributes/0/key == \"component\""
              - key: "log.component"
                value_expression: "/resourceLogs/0/resource/attributes/1/value/stringValue"
                add_when: "/resourceLogs/0/resource/attributes/1/key == \"component.name\" or /resourceLogs/0/resource/attributes/1/key == \"component\""
                overwrite_if_key_exists: false
              - key: "log.component"
                value_expression: "/resourceLogs/0/resource/attributes/2/value/stringValue"
                add_when: "/resourceLogs/0/resource/attributes/2/key == \"component.name\" or /resourceLogs/0/resource/attributes/2/key == \"component\""
                overwrite_if_key_exists: false
              - key: "log.component"
                value_expression: "/resourceLogs/0/resource/attributes/3/value/stringValue"
                add_when: "/resourceLogs/0/resource/attributes/3/key == \"component.name\" or /resourceLogs/0/resource/attributes/3/key == \"component\""
                overwrite_if_key_exists: false
              - key: "log.component"
                value_expression: "/resourceLogs/0/resource/attributes/4/value/stringValue"
                add_when: "/resourceLogs/0/resource/attributes/4/key == \"component.name\" or /resourceLogs/0/resource/attributes/4/key == \"component\""
                overwrite_if_key_exists: false
              - key: "log.component"
                value_expression: "/resourceLogs/0/resource/attributes/5/value/stringValue"
                add_when: "/resourceLogs/0/resource/attributes/5/key == \"component.name\" or /resourceLogs/0/resource/attributes/5/key == \"component\""
                overwrite_if_key_exists: false
              - key: "log.component"
                value_expression: "/resourceLogs/0/resource/attributes/6/value/stringValue"
                add_when: "/resourceLogs/0/resource/attributes/6/key == \"component.name\" or /resourceLogs/0/resource/attributes/6/key == \"component\""
                overwrite_if_key_exists: false
              - key: "log.component"
                value_expression: "/resourceLogs/0/resource/attributes/7/value/stringValue"
                add_when: "/resourceLogs/0/resource/attributes/7/key == \"component.name\" or /resourceLogs/0/resource/attributes/7/key == \"component\""
                overwrite_if_key_exists: false
              - key: "log.component"
                value_expression: "/resourceLogs/0/resource/attributes/8/value/stringValue"
                add_when: "/resourceLogs/0/resource/attributes/8/key == \"component.name\" or /resourceLogs/0/resource/attributes/8/key == \"component\""
                overwrite_if_key_exists: false
              - key: "log.component"
                value_expression: "/resourceLogs/0/scopeLogs/0/logRecords/0/attributes/0/value/stringValue"
                add_when: "/resourceLogs/0/scopeLogs/0/logRecords/0/attributes/0/key == \"component.name\""
                overwrite_if_key_exists: false
              - key: "log.component"
                value_expression: "/resourceLogs/0/scopeLogs/0/logRecords/0/attributes/1/value/stringValue"
                add_when: "/resourceLogs/0/scopeLogs/0/logRecords/0/attributes/1/key == \"component.name\""
                overwrite_if_key_exists: false
              - key: "log.component"
