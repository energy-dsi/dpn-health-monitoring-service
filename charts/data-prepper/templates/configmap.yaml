        - add_entries:
            entries:
              - key: "log.component"
                value_expression: "/log/_role + \"-\" + /log/_type + \"-\" + /log/_stage"
                add_when: "/log/_stage != null and /log/_type != null and /log/_role != null"
                overwrite_if_key_exists: false
        # ── Step 5: fall back log.component to log.service when still not set ────
        - add_entries:
            entries:
              - key: "log.component"
                value_expression: "/log/service"
                add_when: "/log/service != null"
                overwrite_if_key_exists: false
        # Drop the raw OTLP envelope now that its useful fields have been
        # flattened into log.* — prevents field-type mapping conflicts.
        - delete_entries:
            with_keys: ["resourceLogs"]
        - date:
            from_time_received: true
            destination: "@timestamp"
      sink:
        - opensearch:
            hosts:
{{- range .Values.opensearch.hosts }}
              - "{{ . }}"
{{- end }}
            username: "{{ .Values.opensearch.username }}"
            # Placeholder substituted with the real password by the
            # generate-tls-config init container in templates/deployment.yaml
            # (same mechanism as data-prepper-config.yaml's keystore password
            # below) - Data Prepper's ${env:...} substitution does not resolve
            # inside plugin-level config fields like this one.
            password: "__DATAWRITER_PASSWORD__"
            # dpn-health-tls's SAN does not cover dpn-opensearch-health.
            insecure: true
            index: otel-logs-%{yyyy.MM.dd}
            index_type: custom
            bulk_size: 4

    otel-metrics-pipeline:
      source:
        kafka:
          encryption:
            type: none
          bootstrap_servers:
{{- range .Values.kafka.brokers }}
            - "{{ . }}"
{{- end }}
          topics:
            - name: otel-metrics
              group_id: data-prepper-metrics
      processor:
        - parse_json: {}
      sink:
