                add_when: "/resourceLogs/0/scopeLogs/0/logRecords/0/attributes/5/key == \"component.name\""
                overwrite_if_key_exists: false
              - key: "log.component"
                value_expression: "/resourceLogs/0/scopeLogs/0/logRecords/0/attributes/6/value/stringValue"
                add_when: "/resourceLogs/0/scopeLogs/0/logRecords/0/attributes/6/key == \"component.name\""
