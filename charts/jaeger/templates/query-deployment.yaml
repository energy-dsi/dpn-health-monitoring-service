{{- if .Values.query.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.query.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/component: query
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.query.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
      app.kubernetes.io/component: query
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
        app.kubernetes.io/component: query
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: jaeger
              app.kubernetes.io/component: query
              app.kubernetes.io/instance: {{ .Release.Name }}
      securityContext:
{{ toYaml .Values.podSecurityContext | indent 8 }}
      containers:
        - name: query
          image: "{{ .Values.query.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
{{ toYaml .Values.containerSecurityContext | indent 12 }}
          env:
            - name: SPAN_STORAGE_TYPE
              value: elasticsearch
            - name: ES_SERVER_URLS
              value: {{ .Values.storage.elasticsearch.serverUrls | quote }}
            - name: ES_USERNAME
              value: {{ .Values.storage.elasticsearch.username | quote }}
            - name: ES_PASSWORD
              value: {{ .Values.storage.elasticsearch.password | quote }}
            - name: ES_INDEX_PREFIX
              value: {{ .Values.storage.elasticsearch.indexPrefix | quote }}
          ports:
            - name: query
              containerPort: 16686
          resources:
{{ toYaml .Values.query.resources | indent 12 }}
{{- end }}
