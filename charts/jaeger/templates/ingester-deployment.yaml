{{- if .Values.ingester.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.ingester.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/component: ingester
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.ingester.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
      app.kubernetes.io/component: ingester
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
        app.kubernetes.io/component: ingester
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: jaeger
              app.kubernetes.io/component: ingester
              app.kubernetes.io/instance: {{ .Release.Name }}
      securityContext:
{{ toYaml .Values.podSecurityContext | indent 8 }}
      containers:
        - name: ingester
          image: "{{ .Values.ingester.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
{{ toYaml .Values.containerSecurityContext | indent 12 }}
          env:
            - name: SPAN_STORAGE_TYPE
              value: elasticsearch
            - name: ES_SERVER_URLS
              value: {{ .Values.storage.elasticsearch.serverUrls | quote }}
            - name: ES_USERNAME
              value: {{ .Values.storage.elasticsearch.username | quote }}
            - name: ES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dpn-opensearch-health-oidc-secrets
                  key: datawriter-password
            - name: ES_TLS_ENABLED
              value: "true"
            - name: ES_TLS_SKIP_HOST_VERIFY
              value: "true"
            - name: ES_INDEX_PREFIX
              value: {{ .Values.storage.elasticsearch.indexPrefix | quote }}
            # Jaeger's own auto-created index templates (jaeger-service-*,
            # jaeger-span-*) were found live in the cluster with settings
            # only and no field mappings, causing serviceName to fall back
            # to OpenSearch's dynamic "text" mapping and breaking the
            # Jaeger UI's service search (aggregations need "keyword").
            # Explicit here rather than relying on the documented default,
            # since the ingester's own startup logs showed no template
            # creation attempt at all with this var unset.
            - name: ES_CREATE_INDEX_TEMPLATES
              value: "true"
            # Jaeger skips template creation entirely when this is true
            # (ILM manages the index lifecycle instead) — explicit false
            # since this cluster does not use ILM and an unverified default
            # here could silently suppress the template write above.
            - name: ES_USE_ILM
              value: "false"
            - name: KAFKA_CONSUMER_BROKERS
              value: {{ .Values.kafka.brokers | quote }}
            - name: KAFKA_CONSUMER_TOPIC
              value: {{ .Values.kafka.topic | quote }}
            - name: KAFKA_CONSUMER_GROUP_ID
              value: {{ .Values.kafka.consumerGroup | quote }}
            - name: KAFKA_CONSUMER_ENCODING
              value: {{ .Values.kafka.encoding | quote }}
          resources:
{{ toYaml .Values.ingester.resources | indent 12 }}
{{- end }}
