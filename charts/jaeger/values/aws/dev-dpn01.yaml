namespace: ns-dpn-health-01

imagePullSecret: ghcr-pull-secret

image:
  tag: "1.57.0"
  pullPolicy: IfNotPresent

storage:
  type: elasticsearch
  elasticsearch:
    # Security plugin enabled: OpenSearch now serves HTTPS-only and
    # requires a credential. Authenticates as datawriter (all_access via
    # roles_mapping.yml, reserved: false so its password can actually be
    # rotated live via the REST API, unlike admin/kibanaserver) - same
    # user data-prepper and the init Jobs already use.
    serverUrls: "https://dpn-opensearch-health.ns-dpn-health-01.svc.cluster.local:9200"
    username: "datawriter"
    passwordSecretName: dpn-opensearch-health-oidc-secrets
    passwordSecretKey: datawriter-password
    indexPrefix: "jaeger"

kafka:
  brokers: "dpn-kafka-health.ns-dpn-health-01.svc.cluster.local:9092"
  topic: "otel-traces"
  consumerGroup: "jaeger-ingester"
  encoding: protobuf

collector:
  enabled: false
  name: dpn-jaeger-collector-health
  replicaCount: 0
  image:
    repository: <<your specific value>>/jaeger-collector
  service:
    type: ClusterIP
    grpcPort: 14250
    httpPort: 14268
    otlpGrpcPort: 4317
    otlpHttpPort: 4318
    zipkinPort: 9411
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

query:
  enabled: true
  name: dpn-jaeger-query-health
  replicaCount: 2
  image:
    repository: <<your specific value>>/jaeger-query
  service:
    type: ClusterIP
    port: 16686
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

ingester:
  enabled: true
  name: dpn-jaeger-ingester-health
  replicaCount: 2
  image:
    repository: <<your specific value>>/jaeger-ingester
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

loadBalancer:
  enabled: false
  name: dpn-jaeger-query-health-ui
  type: LoadBalancer
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-internal: "true"
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"

podSecurityContext:
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

containerSecurityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1
