namespace: ns-dpn-health-01

image:
  tag: "1.57.0"
  pullPolicy: IfNotPresent

storage:
  type: elasticsearch
  elasticsearch:
    # OpenSearch's security plugin requires HTTPS + auth on 9200 now - see
    # charts/opensearch's securityconfig for the datawriter service account
    # (all_access via roles_mapping.yml), whose password is sourced from the
    # dpn-opensearch-health-oidc-secrets Secret in the deployment templates
    # below (same account data-prepper and the init jobs use).
    # ES_TLS_SKIP_HOST_VERIFY is set alongside this because dpn-health-tls's
    # SAN does not cover dpn-opensearch-health (same reason data-prepper and
    # the init jobs pass --insecure/insecure:true).
    serverUrls: "https://dpn-opensearch-health.ns-dpn-health-01.svc.cluster.local:9200"
    username: "datawriter"
    indexPrefix: "jaeger"

kafka:
  brokers: "dpn-kafka-health.ns-dpn-health-01.svc.cluster.local:9092"
  topic: "otel-traces"
  consumerGroup: "jaeger-ingester"
  encoding: protobuf

collector:
  enabled: false
  name: dpn-jaeger-collector-health
  replicaCount: 0
  image:
    repository: jaegertracing/jaeger-collector
  service:
    type: ClusterIP
    grpcPort: 14250
    httpPort: 14268
    otlpGrpcPort: 4317
    otlpHttpPort: 4318
    zipkinPort: 9411
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

query:
  enabled: true
  name: dpn-jaeger-query-health
  replicaCount: 2
  image:
    repository: jaegertracing/jaeger-query
  service:
    type: ClusterIP
    port: 16686
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

ingester:
  enabled: true
  name: dpn-jaeger-ingester-health
  replicaCount: 2
  image:
    repository: jaegertracing/jaeger-ingester
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

loadBalancer:
  enabled: false
  name: dpn-jaeger-query-health-ui
  type: LoadBalancer
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"

podSecurityContext:
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

containerSecurityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1