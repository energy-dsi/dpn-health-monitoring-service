parameters:
- name: ServiceConnection
  type: string
  default: sc-dpn-dev-001
  values:
    - sc-dpn-dev-001
    - sc-dpn-dev-002
    - sc-dpn-test-001
    - sc-dpn-test-002
    - sc-dpn-pdev-ppd-001
    - sc-dpn-ptest-ppd-001
    - sc-dpn-puat-ppd-001

- name: environment
  type: string
  default: dev
  values:
    - dev
    - devtest
    - test
    - pdev
    - ptest
    - puat

- name: cluster
  type: string
  default: dpn01
  values:
    - dpn01
    - dpn02
- name: approval_group
  displayName: 'Approval Group'
  type: string
  default: dsi-dev
  values:
    - dsi-dev
    - dsi-devtest
    - dsi-ppd

jobs:
- job: DeployKafka
  displayName: Deploy Kafka + Zookeeper
  steps:
  - checkout: self

  - task: AzureCLI@2
    displayName: Deploy Kafka Stack
    inputs:
      azureSubscription: ${{ parameters.ServiceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail

        if [[ "${{ parameters.environment }}" =~ ^(pdev|ptest|puat)$ ]] && [[ "${{ parameters.cluster }}" == "dpn02" ]]; then
          echo "ERROR: Environment '${{ parameters.environment }}' is configured for a single-DPN deployment and does not support cluster '${{ parameters.cluster }}'."
          exit 1
        fi

        CONFIG_FILE="$(Build.SourcesDirectory)/.pipelines/azure-pipelines/config/${{ parameters.environment }}.json"
        CONFIG_FILE_CLUSTER="$(Build.SourcesDirectory)/.pipelines/azure-pipelines/config/${{ parameters.environment }}-${{ parameters.cluster }}.json"

        CHART_DIR="$(Build.SourcesDirectory)/charts/kafka-stack"
        VALUES_FILE="$CHART_DIR/zookeeper-Kafka-values-${{ parameters.environment }}.yaml"
        VALUES_FILE_CLUSTER="$CHART_DIR/zookeeper-Kafka-values-${{ parameters.environment }}-${{ parameters.cluster }}.yaml"

        RELEASE_NAME="dpn-kafka-stack"

        echo "========================================"
        echo "Kafka deployment configuration"
        echo "========================================"
        echo "CONFIG_FILE=$CONFIG_FILE"
        echo "CHART_DIR=$CHART_DIR"
        echo "VALUES_FILE=$VALUES_FILE"
        echo "RELEASE_NAME=$RELEASE_NAME"

        if [ ! -f "$CONFIG_FILE" ]; then
          if [ -f "$CONFIG_FILE_CLUSTER" ]; then
            CONFIG_FILE="$CONFIG_FILE_CLUSTER"
          else
            echo "Config file missing: $CONFIG_FILE"
            exit 1
          fi
        fi

        if [ ! -f "$VALUES_FILE" ]; then
          if [ -f "$VALUES_FILE_CLUSTER" ]; then
            VALUES_FILE="$VALUES_FILE_CLUSTER"
          fi
        fi

        if [ ! -d "$CHART_DIR" ]; then
          echo "Kafka chart directory missing: $CHART_DIR"
          exit 1
        fi

        if [ ! -f "$CHART_DIR/Chart.yaml" ]; then
          echo "Kafka Chart.yaml missing: $CHART_DIR/Chart.yaml"
          exit 1
        fi

        if [ ! -d "$CHART_DIR/templates" ]; then
          echo "Kafka templates directory missing: $CHART_DIR/templates"
          exit 1
        fi

        if [ ! -f "$CHART_DIR/templates/zookeeper-kafka.yaml" ]; then
          echo "Kafka/Zookeeper template missing: $CHART_DIR/templates/zookeeper-kafka.yaml"
          exit 1
        fi

        if [ ! -f "$CHART_DIR/templates/zookeeper-kafka-pvc.yaml" ]; then
          echo "Kafka PVC template missing: $CHART_DIR/templates/zookeeper-kafka-pvc.yaml"
          exit 1
        fi

        if [ ! -f "$CHART_DIR/templates/zookeeper-kafka-lb.yaml" ]; then
          echo "Kafka UI template missing: $CHART_DIR/templates/zookeeper-kafka-lb.yaml"
          exit 1
        fi

        if [ ! -f "$VALUES_FILE" ]; then
          echo "Kafka values file missing: $VALUES_FILE"
          echo "Available Kafka values files:"
          ls -la "$CHART_DIR" | grep "zookeeper-Kafka-values" || true
          exit 1
        fi

        export $(jq -r 'to_entries[] | "\(.key)=\(.value)"' "$CONFIG_FILE")

        echo "RESOURCE_GROUP=$RESOURCE_GROUP"
        echo "AKS_CLUSTER=$AKS_CLUSTER"
        echo "NAMESPACE=$NAMESPACE"

        # Per-cluster LoadBalancer address, optional. zookeeper-Kafka-values-*.yaml
        # is shared by every cluster, so the kafkaUi.service.loadBalancerIP pinned in
        # it can only be right for one — dev-dpn01's 10.226.121.10 is not in
        # dev-dpn02's subnet, and Azure rejects an out-of-subnet pin with
        # PrivateIPAddressNotInSubnet, leaving the Service <pending> until helm --wait
        # times out (exactly the failure this override exists to prevent). Same pattern
        # as OBSERVABILITY_LB_IP in deploy-oauth2-proxy.sh.
        HELM_SET=()
        if [ -n "${OBSERVABILITY_LB_IP:-}" ]; then
          echo "OBSERVABILITY_LB_IP=$OBSERVABILITY_LB_IP (overrides kafkaUi.service.loadBalancerIP)"
          HELM_SET+=(--set "kafkaUi.service.loadBalancerIP=$OBSERVABILITY_LB_IP")
        fi

        az aks install-cli --kubelogin-version v0.2.19

        az account set --subscription "$AZURE_SUBSCRIPTION_ID"

        az aks get-credentials \
          --resource-group "$RESOURCE_GROUP" \
          --name "$AKS_CLUSTER" \
          --overwrite-existing

        kubelogin convert-kubeconfig -l azurecli

        echo "Checking namespace..."
        kubectl get namespace "$NAMESPACE"

        echo "========================================"
        echo "Linting Kafka chart"
        echo "========================================"

        helm lint "$CHART_DIR" \
          -f "$VALUES_FILE" \
          --set namespace="$NAMESPACE" \
          --set kafka.enabled=true

        echo "========================================"
        echo "Rendering Kafka + Zookeeper manifests"
        echo "========================================"

        helm template "$RELEASE_NAME" "$CHART_DIR" \
          --namespace "$NAMESPACE" \
          -f "$VALUES_FILE" \
          --set namespace="$NAMESPACE" \
          --set kafka.enabled=true \
          ${HELM_SET[@]+"${HELM_SET[@]}"} \
          --debug > /tmp/kafka-zookeeper-rendered.yaml

        echo "Rendered resource kinds:"
        grep "^kind:" /tmp/kafka-zookeeper-rendered.yaml || true

        echo "========================================"
        echo "Checking expected rendered names"
        echo "========================================"

        grep -n "name: dpn-zookeeper-health" /tmp/kafka-zookeeper-rendered.yaml || true
        grep -n "name: dpn-kafka-health" /tmp/kafka-zookeeper-rendered.yaml || true
        grep -n "name: dpn-kafka-health-ui" /tmp/kafka-zookeeper-rendered.yaml || true

        echo "========================================"
        echo "Validating rendered resources"
        echo "========================================"

        if ! grep -q "name: dpn-zookeeper-health" /tmp/kafka-zookeeper-rendered.yaml; then
          echo "ERROR: dpn-zookeeper-health was not rendered."
          exit 1
        fi

        if ! grep -q "name: dpn-kafka-health" /tmp/kafka-zookeeper-rendered.yaml; then
          echo "ERROR: dpn-kafka-health was not rendered."
          exit 1
        fi

        if ! grep -q "name: dpn-kafka-health-ui" /tmp/kafka-zookeeper-rendered.yaml; then
          echo "ERROR: dpn-kafka-health-ui was not rendered."
          exit 1
        fi

        if grep -q "name: dpn-kafka-ui-health" /tmp/kafka-zookeeper-rendered.yaml; then
          echo "ERROR: Incorrect UI name dpn-kafka-ui-health found. Expected dpn-kafka-health-ui."
          exit 1
        fi

        if grep -q "name: dpn-kafka$" /tmp/kafka-zookeeper-rendered.yaml; then
          echo "ERROR: Old broker name dpn-kafka found. Expected dpn-kafka-health."
          exit 1
        fi

        if grep -q "name: dpn-zookeeper$" /tmp/kafka-zookeeper-rendered.yaml; then
          echo "ERROR: Old zookeeper name dpn-zookeeper found. Expected dpn-zookeeper-health."
          exit 1
        fi

        echo "========================================"
        echo "Checking Helm release status"
        echo "========================================"

        HELM_STATUS="$(helm status "$RELEASE_NAME" -n "$NAMESPACE" -o json 2>/dev/null | jq -r '.info.status' || echo not-found)"
        echo "Current Helm status: $HELM_STATUS"

        if echo "$HELM_STATUS" | grep -q "pending"; then
          echo "Helm release is stuck in $HELM_STATUS. Uninstalling..."
          helm uninstall "$RELEASE_NAME" -n "$NAMESPACE" || true
        fi

        echo "========================================"
        echo "Deploying Kafka + Zookeeper with Helm"
        echo "========================================"

        helm upgrade --install "$RELEASE_NAME" "$CHART_DIR" \
          --namespace "$NAMESPACE" \
          -f "$VALUES_FILE" \
          --set namespace="$NAMESPACE" \
          --set kafka.enabled=true \
          ${HELM_SET[@]+"${HELM_SET[@]}"} \
          --wait \
          --timeout 10m \
          --debug

        echo "========================================"
        echo "Waiting for Zookeeper rollout"
        echo "========================================"

        kubectl rollout status deployment/dpn-zookeeper-health \
          -n "$NAMESPACE" \
          --timeout=300s

        echo "========================================"
        echo "Waiting for Kafka rollout"
        echo "========================================"

        kubectl rollout status deployment/dpn-kafka-health \
          -n "$NAMESPACE" \
          --timeout=300s

        echo "========================================"
        echo "Waiting for Kafka UI rollout"
        echo "========================================"

        kubectl rollout status deployment/dpn-kafka-health-ui \
          -n "$NAMESPACE" \
          --timeout=300s

        echo "========================================"
        echo "Kafka stack deployed successfully"
        echo "========================================"

        echo "Kafka/Zookeeper pods:"
        kubectl get pods -n "$NAMESPACE" | grep -E "kafka|zookeeper" || true

        echo "Kafka/Zookeeper services:"
        kubectl get svc -n "$NAMESPACE" | grep -E "kafka|zookeeper" || true

        echo "Kafka/Zookeeper endpoints:"
        kubectl get endpoints -n "$NAMESPACE" | grep -E "kafka|zookeeper" || true

        echo "Kafka deployment completed."