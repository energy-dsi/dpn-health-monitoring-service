parameters:
- name: ServiceConnection
  type: string
  default: sc-dpn-dev-001
  values:
    - sc-dpn-dev-001
    - sc-dpn-dev-002
    - sc-dpn-test-001
    - sc-dpn-test-002
    - sc-dpn-pdev-ppd-001
    - sc-dpn-ptest-ppd-001
    - sc-dpn-puat-ppd-001

- name: environment
  type: string
  default: dev
  values:
    - dev
    - devtest
    - test
    - pdev
    - ptest
    - puat

- name: cluster
  type: string
  default: dpn01
  values:
    - dpn01
    - dpn02

- name: approval_group
  displayName: 'Approval Group'
  type: string
  default: dsi-dev
  values:
    - dsi-dev
    - dsi-devtest
    - dsi-ppd

jobs:
- deployment: DeployJaeger
  displayName: Deploy Jaeger
  ${{ if or(eq(parameters.environment, 'pdev'), eq(parameters.environment, 'ptest'), eq(parameters.environment, 'puat')) }}:
    environment: dsi-ppd
  ${{ elseif or(eq(parameters.environment, 'devtest'), eq(parameters.environment, 'test')) }}:
    environment: dsi-devtest
  ${{ else }}:
    environment: dsi-dev

  strategy:
    runOnce:
      deploy:
        steps:
        - checkout: self

        - task: AzureCLI@2
          displayName: Deploy Jaeger
          inputs:
            azureSubscription: ${{ parameters.ServiceConnection }}
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -euo pipefail

              if [[ "${{ parameters.environment }}" =~ ^(pdev|ptest|puat)$ ]] && [[ "${{ parameters.cluster }}" == "dpn02" ]]; then
                echo "ERROR: Environment '${{ parameters.environment }}' is configured for a single-DPN deployment and does not support cluster '${{ parameters.cluster }}'."
                exit 1
              fi

              CONFIG_FILE="$(Build.SourcesDirectory)/.pipelines/azure-pipelines/config/${{ parameters.environment }}.json"
              CONFIG_FILE_CLUSTER="$(Build.SourcesDirectory)/.pipelines/azure-pipelines/config/${{ parameters.environment }}-${{ parameters.cluster }}.json"

              RELEASE_NAME="dpn-jaeger"
              CHART_DIR="$(Build.SourcesDirectory)/charts/jaeger"
              VALUES_FILE="$CHART_DIR/values.yaml"

              echo "CONFIG_FILE=$CONFIG_FILE"
              echo "CHART_DIR=$CHART_DIR"
              echo "VALUES_FILE=$VALUES_FILE"

              if [ ! -f "$CONFIG_FILE" ]; then
                if [ -f "$CONFIG_FILE_CLUSTER" ]; then
                  CONFIG_FILE="$CONFIG_FILE_CLUSTER"
                else
                  echo "Config file missing: $CONFIG_FILE"
                  exit 1
                fi
              fi

              if [ ! -d "$CHART_DIR" ]; then
                echo "Jaeger chart directory missing: $CHART_DIR"
                exit 1
              fi

              if [ ! -f "$CHART_DIR/Chart.yaml" ]; then
                echo "Jaeger Chart.yaml missing: $CHART_DIR/Chart.yaml"
                exit 1
              fi

              if [ ! -d "$CHART_DIR/templates" ]; then
                echo "Jaeger templates directory missing: $CHART_DIR/templates"
                exit 1
              fi

              if [ ! -f "$VALUES_FILE" ]; then
                echo "Jaeger values file missing: $VALUES_FILE"
                exit 1
              fi

              export $(jq -r 'to_entries[] | "\(.key)=\(.value)"' "$CONFIG_FILE")

              echo "RESOURCE_GROUP=$RESOURCE_GROUP"
              echo "AKS_CLUSTER=$AKS_CLUSTER"
              echo "NAMESPACE=$NAMESPACE"

              az aks install-cli --kubelogin-version v0.2.19

              az account set --subscription "$AZURE_SUBSCRIPTION_ID"

              az aks get-credentials \
                --resource-group "$RESOURCE_GROUP" \
                --name "$AKS_CLUSTER" \
                --overwrite-existing

              kubelogin convert-kubeconfig -l azurecli

              echo "Checking namespace..."
              kubectl get namespace "$NAMESPACE"

              echo "========================================"
              echo "Checking Jaeger dependencies..."
              echo "========================================"

              echo "Checking Kafka service..."
              kubectl get svc dpn-kafka-health -n "$NAMESPACE"

                echo "Checking Kafka endpoints..."

                KAFKA_PORTS=$(kubectl get endpoints dpn-kafka-health \
                  -n "$NAMESPACE" \
                  -o jsonpath='{.subsets[*].ports[*].port}')

                echo "Kafka endpoint ports: $KAFKA_PORTS"

                if ! echo "$KAFKA_PORTS" | grep -wq "9092"; then
                  echo "Kafka endpoint dpn-kafka-health does not have ready backend on port 9092"

                  kubectl get endpoints dpn-kafka-health \
                    -n "$NAMESPACE" \
                    -o yaml || true

                  exit 1
                fi

                echo "Kafka endpoint validation passed."

              echo "Checking OpenSearch service..."
              kubectl get svc dpn-opensearch-health -n "$NAMESPACE"

              echo "Checking OpenSearch endpoints..."
              if ! kubectl get endpoints dpn-opensearch-health -n "$NAMESPACE" | grep -q ":9200"; then
                echo "OpenSearch endpoint dpn-opensearch-health does not have ready backend on port 9200"
                kubectl get endpoints dpn-opensearch-health -n "$NAMESPACE" || true
                exit 1
              fi

              echo "========================================"
              echo "Linting Jaeger chart..."
              echo "========================================"

              helm lint "$CHART_DIR" -f "$VALUES_FILE"

              echo "========================================"
              echo "Rendering Jaeger chart..."
              echo "========================================"

              helm template "$RELEASE_NAME" "$CHART_DIR" \
                --namespace "$NAMESPACE" \
                -f "$VALUES_FILE" \
                --debug > /tmp/jaeger-rendered.yaml

              echo "========================================"
              echo "Deploying Jaeger custom chart..."
              echo "========================================"

              helm upgrade --install "$RELEASE_NAME" "$CHART_DIR" \
                --namespace "$NAMESPACE" \
                -f "$VALUES_FILE" \
                --wait \
                --timeout 10m \
                --debug

              echo "========================================"
              echo "Jaeger rollout status..."
              echo "========================================"

              kubectl rollout status deployment/dpn-jaeger-ingester-health \
                -n "$NAMESPACE" \
                --timeout=300s

              kubectl rollout status deployment/dpn-jaeger-query-health \
                -n "$NAMESPACE" \
                --timeout=300s

              echo "========================================"
              echo "Jaeger endpoints:"
              echo "========================================"

              kubectl get endpoints -n "$NAMESPACE" | grep jaeger || true

              echo "========================================"
              echo "Jaeger logs:"
              echo "========================================"

              kubectl logs -n "$NAMESPACE" \
                -l app.kubernetes.io/name=jaeger \
                --tail=150 || true

              echo "========================================"
              echo "Testing Jaeger Query UI service..."
              echo "========================================"

              if kubectl get svc dpn-jaeger-query-health -n "$NAMESPACE" >/dev/null 2>&1; then
                kubectl run jaeger-curl-test \
                  -n "$NAMESPACE" \
                  --image=curlimages/curl:8.8.0 \
                  --restart=Never \
                  --rm \
                  --attach \
                  --command -- sh -c "curl -i --max-time 10 http://dpn-jaeger-query-health:16686 || true"
              else
                echo "Service dpn-jaeger-query-health not found. Skipping curl test."
              fi

              echo "Jaeger deployment completed."