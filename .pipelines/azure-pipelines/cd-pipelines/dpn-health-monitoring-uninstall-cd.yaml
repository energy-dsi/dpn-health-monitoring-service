# ============================================================================
# DPN Health Monitoring — Uninstall (reverse of the master CD)
# ============================================================================
# Uninstalls EVERY Helm release this stack deploys (not selective), in the exact
# REVERSE of the master-CD order so dependents go before their dependencies:
#
#   Nginx -> OTel -> Perses -> Jaeger -> DataPrepper -> Thanos -> Prometheus
#         -> OpenSearch -> Kafka
#
# Only Helm-created resources are removed. Anything created outside Helm via
# kubectl — including OpenSearch's raw resources (dashboards, init jobs,
# provisioning configmap) — is intentionally LEFT IN PLACE.
#
# ----------------------------------------------------------------------------
# DATA PERSISTENCY — which PVCs survive an uninstall
# ----------------------------------------------------------------------------
# `helm uninstall` never deletes StatefulSet volumes, so the DATA stores are
# RETAINED and reattach on the next install:
#   - OpenSearch  : dpn-opensearch-health-dpn-opensearch-health-0
#   - Prometheus  : prometheus-dpn-prometheus-kube-promet-prometheus-db-*  (one per replica)
#   - Alertmanager: alertmanager-dpn-prometheus-kube-promet-alertmanager-db-*  (one per replica)
#
# The Helm-templated PVCs (transient message buffer / dashboard state) ARE
# removed by `helm uninstall`:
#   - Kafka     : dpn-kafka-health-pvc
#   - Zookeeper : dpn-zookeeper-health-pvc
#   - Perses    : dpn-perses-data
# (A clean Kafka/Zookeeper on the next install is desirable — it avoids a stale
#  cluster-id mismatch. The namespace and manual dpn-nginx-basic-auth secret are
#  never touched.)
# ----------------------------------------------------------------------------

trigger: none

pool:
  name: '<<YOUR AGENT POOL>>'

parameters:
- name: ServiceConnection
  type: string
  default: sc-dpn-dev-001
  values:
    - sc-dpn-dev-001
    - sc-dpn-dev-002
    - sc-dpn-test-001
    - sc-dpn-test-002
    - sc-dpn-pdev-ppd-001
    - sc-dpn-ptest-ppd-001
    - sc-dpn-puat-ppd-001

- name: environment
  type: string
  default: dev
  values:
    - dev
    - devtest
    - test
    - pdev
    - ptest
    - puat

- name: cluster
  type: string
  default: dpn01
  values:
    - dpn01
    - dpn02

# NOTE: approval_group is NOT used — the approval gate is derived from the
# `environment` parameter (see the if/elseif/else on the deployment job below).
# Left commented for reference.
# - name: approval_group
#   displayName: 'Approval Group'
#   type: string
#   default: dsi-dev
#   values:
#     - dsi-dev
#     - dsi-devtest
#     - dsi-ppd

stages:
- stage: Uninstall
  displayName: Uninstall
  jobs:
  - deployment: Uninstall
    displayName: Uninstall the entire stack (all Helm releases)
    ${{ if or(eq(parameters.environment, 'pdev'), eq(parameters.environment, 'ptest'), eq(parameters.environment, 'puat')) }}:
      environment: dsi-ppd
    ${{ elseif or(eq(parameters.environment, 'devtest'), eq(parameters.environment, 'test')) }}:
      environment: dsi-devtest
    ${{ else }}:
      environment: dsi-dev
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - task: AzureCLI@2
            displayName: Uninstall all Helm releases
            inputs:
              azureSubscription: ${{ parameters.ServiceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -uo pipefail

                if [[ "${{ parameters.environment }}" =~ ^(pdev|ptest|puat)$ ]] && [[ "${{ parameters.cluster }}" == "dpn02" ]]; then
                  echo "ERROR: '${{ parameters.environment }}' does not support cluster '${{ parameters.cluster }}'."
                  exit 1
                fi

                CONFIG_FILE="$(Build.SourcesDirectory)/.pipelines/azure-pipelines/config/${{ parameters.environment }}.json"
                CONFIG_FILE_CLUSTER="$(Build.SourcesDirectory)/.pipelines/azure-pipelines/config/${{ parameters.environment }}-${{ parameters.cluster }}.json"
                if [ ! -f "$CONFIG_FILE" ]; then CONFIG_FILE="$CONFIG_FILE_CLUSTER"; fi
                [ -f "$CONFIG_FILE" ] || { echo "Config file missing: $CONFIG_FILE"; exit 1; }

                export $(jq -r 'to_entries[] | "\(.key)=\(.value)"' "$CONFIG_FILE")
                echo "NAMESPACE=$NAMESPACE  AKS_CLUSTER=$AKS_CLUSTER"

                # Install CLIs only if missing (avoids GitHub download rate limits on re-runs)
                if ! command -v kubectl &>/dev/null || ! command -v kubelogin &>/dev/null; then
                  echo "kubectl or kubelogin not found, installing..."
                  az aks install-cli --client-version 1.32.0 --kubelogin-version 0.1.4
                else
                  echo "kubectl and kubelogin already installed, skipping"
                fi

                az account set --subscription "$AZURE_SUBSCRIPTION_ID"
                az aks get-credentials --resource-group "$RESOURCE_GROUP" --name "$AKS_CLUSTER" --overwrite-existing
                kubelogin convert-kubeconfig -l azurecli
                kubectl get namespace "$NAMESPACE"

                # name | release  — REVERSE of the master-CD order
                COMPONENTS=(
                  "nginx|dpn-nginx-observability"
                  "otel|dpn-otel-collector-health"
                  "perses|dpn-perses"
                  "jaeger|dpn-jaeger"
                  "data-prepper|dpn-data-prepper"
                  "thanos|dpn-thanos"
                  "prometheus|dpn-prometheus"
                  "opensearch|dpn-opensearch"
                  "kafka|dpn-kafka-stack"
                )

                DONE=(); SKIPPED=(); FAILED=()

                for c in "${COMPONENTS[@]}"; do
                  NAME="${c%%|*}"; RELEASE="${c##*|}"
                  echo ""
                  echo "======================================================================"
                  echo "helm uninstall  ->  $NAME  ($RELEASE)"
                  echo "======================================================================"

                  if ! helm status "$RELEASE" -n "$NAMESPACE" >/dev/null 2>&1; then
                    echo "Release $RELEASE not installed in $NAMESPACE — skipping."
                    SKIPPED+=("$NAME")
                    continue
                  fi

                  if helm uninstall "$RELEASE" -n "$NAMESPACE" --wait --timeout 15m; then
                    DONE+=("$NAME")
                  else
                    echo "ERROR: uninstall of $RELEASE failed."
                    FAILED+=("$NAME")
                  fi
                done

                echo ""
                echo "======================================================================"
                echo "Uninstall summary"
                echo "======================================================================"
                echo "Uninstalled (${#DONE[@]}): ${DONE[*]:-none}"
                echo "Skipped not-installed (${#SKIPPED[@]}): ${SKIPPED[*]:-none}"
                echo "Retained data PVCs: OpenSearch / Prometheus / Alertmanager StatefulSet volumes."
                echo "Remaining Helm releases in $NAMESPACE:"
                helm list -n "$NAMESPACE" || true
                if [ "${#FAILED[@]}" -gt 0 ]; then
                  echo "Failed (${#FAILED[@]}): ${FAILED[*]}"
                  exit 1
                fi
                echo "Uninstall completed."
