parameters:
- name: ServiceConnection
  type: string
  default: sc-dpn-dev-001
  values:
    - sc-dpn-dev-001
    - sc-dpn-dev-002
    - sc-dpn-test-001
    - sc-dpn-test-002
    - sc-dpn-pdev-ppd-001
    - sc-dpn-ptest-ppd-001
    - sc-dpn-puat-ppd-001

- name: environment
  type: string
  default: dev
  values:
    - dev
    - devtest
    - test
    - pdev
    - ptest
    - puat

- name: cluster
  type: string
  default: dpn01
  values:
    - dpn01
    - dpn02

- name: approval_group
  displayName: 'Approval Group'
  type: string
  default: dsi-dev
  values:
    - dsi-dev
    - dsi-devtest
    - dsi-ppd

jobs:
- job: ValidateRequiredSecrets
  displayName: Validate required secrets exist in Key Vault
  steps:
  - checkout: self

  - task: AzureCLI@2
    displayName: Check required Key Vault secrets exist
    inputs:
      azureSubscription: ${{ parameters.ServiceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail

        if [[ "${{ parameters.environment }}" =~ ^(pdev|ptest|puat)$ ]] && [[ "${{ parameters.cluster }}" == "dpn02" ]]; then
          echo "ERROR: Environment '${{ parameters.environment }}' is configured for a single-DPN deployment and does not support cluster '${{ parameters.cluster }}'."
          exit 1
        fi

        CONFIG_FILE="$(Build.SourcesDirectory)/.pipelines/azure-pipelines/config/${{ parameters.environment }}.json"
        CONFIG_FILE_CLUSTER="$(Build.SourcesDirectory)/.pipelines/azure-pipelines/config/${{ parameters.environment }}-${{ parameters.cluster }}.json"

        if [ ! -f "$CONFIG_FILE" ]; then
          if [ -f "$CONFIG_FILE_CLUSTER" ]; then
            CONFIG_FILE="$CONFIG_FILE_CLUSTER"
          else
            echo "Config file missing: $CONFIG_FILE"
            exit 1
          fi
        fi

        export $(jq -r 'to_entries[] | "\(.key)=\(.value)"' "$CONFIG_FILE")

        echo "KEY_VAULT_NAME=$KEY_VAULT_NAME"
        echo "NAMESPACE=$NAMESPACE"

        az account set --subscription "$AZURE_SUBSCRIPTION_ID"

        echo "========================================"
        echo "Checking every Key Vault secret a component syncs directly (not via"
        echo "another component's already-synced Secret) needs to already exist"
        echo "========================================"

        # Only existence is checked, never the value: this catches the
        # FailedMount/DeadlineExceeded class of failure (missing or
        # misnamed Key Vault object) before the stage that needs it times
        # out on a helm upgrade --wait, rather than after. Everything
        # else in this pipeline either has no Key Vault secret of its
        # own (e.g. OTel Collector, Perses, Prometheus, Thanos, dpn-
        # portal) or reuses an existing Secret another component already
        # synced (e.g. Jaeger reads dpn-opensearch-health-oidc-secrets,
        # kafka-stack's kafka-ui-oidc-rbac SecretProviderClass writing
        # into the shared dpn-keycloak-shared-akv Secret) rather than
        # syncing its own copy, so there is nothing to check for those
        # beyond what their upstream component already covers.
        #
        # TRUSTSTORE-PASSWORD is no longer in this map: nothing in this
        # repo syncs it from Key Vault directly anymore (kafka-stack and
        # data-prepper both read it from tls-auth-secret instead - see
        # below), so its Key Vault existence is dpn-tls-cd's own
        # pre-flight concern, not this pipeline's.
        declare -A SECRET_CONSUMER=(
          [KC-SERVICE-CLIENT-SECRET]="kafka-stack + every oauth2-proxy release"
          [KC-OPENSEARCH-ADMIN-PASSWORD]="opensearch (opensearch-oidc-kv-secretproviderclass)"
          [KC-OPENSEARCH-KIBANASERVER-PASSWORD]="opensearch (opensearch-oidc-kv-secretproviderclass)"
          [KC-OPENSEARCH-DATAWRITER-PASSWORD]="opensearch (opensearch-oidc-kv-secretproviderclass)"
        )

        MISSING=0
        for SECRET_NAME in "${!SECRET_CONSUMER[@]}"; do
          if az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name "$SECRET_NAME" --query id -o tsv >/dev/null 2>&1; then
            echo "  [OK]      $SECRET_NAME (${SECRET_CONSUMER[$SECRET_NAME]})"
          else
            echo "##[error]  [MISSING] $SECRET_NAME (${SECRET_CONSUMER[$SECRET_NAME]}) not found in $KEY_VAULT_NAME"
            MISSING=1
          fi
        done

        if [ "$MISSING" -eq 1 ]; then
          echo ""
          echo "##[error] One or more secrets a DPN component syncs directly from Key Vault"
          echo "##[error] are missing from $KEY_VAULT_NAME. These are provisioned manually"
          echo "##[error] as part of Keycloak's own setup (see dpn-authentication-service),"
          echo "##[error] not by this pipeline."
          exit 1
        fi

        echo ""
        echo "All required secrets present in $KEY_VAULT_NAME."

        echo "========================================"
        echo "Checking tls-auth-secret already exists in $NAMESPACE"
        echo "========================================"

        # tls-auth-secret (KEYSTORE_PASSWORD/TRUSTSTORE_PASSWORD/
        # DPN_CLIENT_P12_PASSWORD) is created directly into this
        # namespace by dpn-tls-cd.yaml (dpn-federator-certificate-
        # manager), not by this pipeline. Kafka UI and Data Prepper
        # both read it - see charts/kafka-stack/templates/
        # zookeeper-kafka-lb.yaml and charts/data-prepper/templates/
        # deployment.yaml. Unlike the Key Vault checks above, a missing
        # Key Vault object isn't the risk here (dpn-tls-cd validates
        # that itself) - the risk is dpn-tls-cd simply not having been
        # (re)run against THIS environment yet, which a Key Vault check
        # alone would not catch. Failing fast here with a clear message
        # avoids the Kafka stage instead dying deep inside a
        # CreateContainerConfigError.
        az aks install-cli --kubelogin-version v0.2.19
        az aks get-credentials \
          --resource-group "$RESOURCE_GROUP" \
          --name "$AKS_CLUSTER" \
          --overwrite-existing
        kubelogin convert-kubeconfig -l azurecli

        if kubectl get secret tls-auth-secret -n "$NAMESPACE" >/dev/null 2>&1; then
          echo "  [OK]      tls-auth-secret exists in $NAMESPACE"
        else
          echo "##[error]  [MISSING] tls-auth-secret not found in $NAMESPACE"
          echo "##[error] Run dpn-tls-cd (dpn-federator-certificate-manager) against this"
          echo "##[error] environment first - it creates tls-auth-secret directly, it is"
          echo "##[error] never synced by this pipeline."
          exit 1
        fi
