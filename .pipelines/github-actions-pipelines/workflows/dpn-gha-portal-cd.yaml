name: DPN CD - Portal

# Deploys dpn-health-monitoring/charts/dpn-portal — the tile landing page.
# Ported from dpn-health-monitoring-service's app/dpn-portal +
# charts/dpn-portal, whose own CI (Azure DevOps, ACR) builds and pushes this
# image. That image is also published to GHCR at
# <<your specific value>>/dpn-portal, same registry every other chart in
# this repo pulls from — this workflow deploys from there, not ACR.
#
# charts/dpn-portal/values.yaml deliberately leaves image.repository/tag
# blank and fails to render rather than guessing a registry path, so both are
# always supplied here via --set.
#
# dpn-portal has no auth/TLS of its own — it must be fronted by the
# oauth2-proxy "portal" release (values-portal.yaml) before it is reachable
# from outside the cluster. See dpn-health-monitoring/charts/oauth2-proxy/README.md.

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      cluster:
        required: true
        type: string
      cloud:
        required: true
        type: string
      ACR_NAME:
        required: true
        type: string
      BASE_REGISTRY:
        required: true
        type: string
      AZURE_SUBSCRIPTION_ID:
        required: true
        type: string
      RESOURCE_GROUP:
        required: true
        type: string
      AKS_CLUSTER:
        required: true
        type: string
      KEY_VAULT_NAME:
        required: true
        type: string
      NAMESPACE:
        required: true
        type: string
      ARM_SUBSCRIPTION_ID:
        required: true
        type: string
      AWS_REGION:
        required: false
        type: string
      AWS_ACCOUNT_ID:
        required: false
        type: string
      EKS_CLUSTER:
        required: false
        type: string
      imageTag:
        description: "dpn-portal image tag — the short git-SHA dpn-portal-ci.yaml's BuildAndPush stage printed"
        required: true
        type: string
      imageRepository:
        description: "dpn-portal image path AFTER <<your specific value>>/"
        required: false
        default: "1.0.1/dpn-portal"
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy Portal
    runs-on: [self-hosted, vmss]
    environment: ${{ inputs.environment }}-${{ inputs.cluster }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Export Config as Env Vars
        shell: bash
        run: |
          echo "ACR_NAME=${{ inputs.ACR_NAME }}" >> "$GITHUB_ENV"
          echo "BASE_REGISTRY=${{ inputs.BASE_REGISTRY }}" >> "$GITHUB_ENV"
          echo "AZURE_SUBSCRIPTION_ID=${{ inputs.AZURE_SUBSCRIPTION_ID }}" >> "$GITHUB_ENV"
          echo "RESOURCE_GROUP=${{ inputs.RESOURCE_GROUP }}" >> "$GITHUB_ENV"
          echo "AKS_CLUSTER=${{ inputs.AKS_CLUSTER }}" >> "$GITHUB_ENV"
          echo "KEY_VAULT_NAME=${{ inputs.KEY_VAULT_NAME }}" >> "$GITHUB_ENV"
          echo "NAMESPACE=${{ inputs.NAMESPACE }}" >> "$GITHUB_ENV"
          echo "ARM_SUBSCRIPTION_ID=${{ inputs.ARM_SUBSCRIPTION_ID }}" >> "$GITHUB_ENV"
          echo "AWS_REGION=${{ inputs.AWS_REGION }}" >> "$GITHUB_ENV"
          echo "AWS_ACCOUNT_ID=${{ inputs.AWS_ACCOUNT_ID }}" >> "$GITHUB_ENV"
          echo "EKS_CLUSTER=${{ inputs.EKS_CLUSTER }}" >> "$GITHUB_ENV"

      - name: Cloud Login
        uses: ./.github/actions/cloud-login
        with:
          cloud: ${{ inputs.cloud }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          aws-region: ${{ env.AWS_REGION }}
          aws-account-id: ${{ env.AWS_ACCOUNT_ID }}
          eks-cluster: ${{ env.EKS_CLUSTER }}

      - name: Verify Cluster Access
        shell: bash
        run: |
          set -euo pipefail

          helm ls -n "$NAMESPACE"
          kubectl get all -n "$NAMESPACE"

      - name: Deploy dpn-portal
        shell: bash
        run: |
          set -euo pipefail

          HELM_DIR="dpn-health-monitoring/charts/dpn-portal"
          VALUES_FILE="$HELM_DIR/values/${{ inputs.cloud }}/${{ inputs.environment }}-${{ inputs.cluster }}.yaml"
          RELEASE_NAME="dpn-portal"
          IMAGE_REPOSITORY="<<your specific value>>/${{ inputs.imageRepository }}"

          echo "HELM_DIR=$HELM_DIR"
          echo "VALUES_FILE=$VALUES_FILE"
          echo "image.repository=$IMAGE_REPOSITORY"
          echo "image.tag=${{ inputs.imageTag }}"

          if [ ! -d "$HELM_DIR" ]; then
            echo "dpn-portal chart directory missing: $HELM_DIR"
            exit 1
          fi

          if [ ! -f "$VALUES_FILE" ]; then
            echo "dpn-portal values file missing: $VALUES_FILE"
            exit 1
          fi

          echo "========================================"
          echo "Linting dpn-portal chart..."
          echo "========================================"

          helm lint "$HELM_DIR" \
            -f "$VALUES_FILE" \
            --set namespace="$NAMESPACE" \
            --set image.repository="$IMAGE_REPOSITORY" \
            --set image.tag="${{ inputs.imageTag }}" \
            --debug

          echo "========================================"
          echo "Rendering dpn-portal chart..."
          echo "========================================"

          helm template "$RELEASE_NAME" "$HELM_DIR" \
            --namespace "$NAMESPACE" \
            -f "$VALUES_FILE" \
            --set namespace="$NAMESPACE" \
            --set image.repository="$IMAGE_REPOSITORY" \
            --set image.tag="${{ inputs.imageTag }}" \
            --debug > /tmp/portal-rendered.yaml

          echo "Rendered resource kinds:"
          grep "^kind:" /tmp/portal-rendered.yaml || true

          echo "========================================"
          echo "Deploying dpn-portal..."
          echo "========================================"

          if [ "${{ inputs.cloud }}" = "aws" ]; then
            # NOTE: no --wait here, same reasoning as dpn-cd-otel.yml — a
            # long-lived Helm watch against the EKS API from this runner is
            # unreliable and can time out even when the rollout completed on
            # the cluster. Poll rollout status separately below instead.
            helm upgrade --install "$RELEASE_NAME" "$HELM_DIR" \
              --namespace "$NAMESPACE" \
              -f "$VALUES_FILE" \
              --set namespace="$NAMESPACE" \
              --set image.repository="$IMAGE_REPOSITORY" \
              --set image.tag="${{ inputs.imageTag }}" \
              --debug
          else
            helm upgrade --install "$RELEASE_NAME" "$HELM_DIR" \
              --namespace "$NAMESPACE" \
              -f "$VALUES_FILE" \
              --set namespace="$NAMESPACE" \
              --set image.repository="$IMAGE_REPOSITORY" \
              --set image.tag="${{ inputs.imageTag }}" \
              --wait \
              --timeout 5m \
              --debug
          fi

          echo "========================================"
          echo "Waiting for dpn-portal rollout..."
          echo "========================================"

          if [ "${{ inputs.cloud }}" = "aws" ]; then
            ROLLOUT_OK=false
            for attempt in 1 2 3 4 5; do
              if kubectl rollout status deployment/dpn-portal -n "$NAMESPACE" --timeout=60s; then
                ROLLOUT_OK=true
                break
              fi
              echo "Rollout status attempt $attempt/5 did not complete within 60s — retrying..."
              sleep 10
            done
            if [ "$ROLLOUT_OK" != "true" ]; then
              echo "::error::Deployment dpn-portal did not report ready after 5 attempts."
              exit 1
            fi
          else
            kubectl rollout status deployment/dpn-portal \
              -n "$NAMESPACE" \
              --timeout=300s
          fi

          echo "========================================"
          echo "dpn-portal resources:"
          echo "========================================"

          kubectl get pods -n "$NAMESPACE" -l app=dpn-portal
          kubectl get svc -n "$NAMESPACE" | grep dpn-portal || true

          echo ""
          echo "dpn-portal deployed. Run the 'portal' component of"
          echo "dpn-cd-oauth2-proxy.yml next to put the Keycloak gateway in front of it."
