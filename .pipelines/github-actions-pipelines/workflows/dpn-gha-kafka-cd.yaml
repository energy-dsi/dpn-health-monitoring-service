name: DPN CD - Kafka

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      cluster:
        required: true
        type: string
      cloud:
        required: true
        type: string
      ACR_NAME:
        required: true
        type: string
      BASE_REGISTRY:
        required: true
        type: string
      AZURE_SUBSCRIPTION_ID:
        required: true
        type: string
      RESOURCE_GROUP:
        required: true
        type: string
      AKS_CLUSTER:
        required: true
        type: string
      KEY_VAULT_NAME:
        required: true
        type: string
      NAMESPACE:
        required: true
        type: string
      ARM_SUBSCRIPTION_ID:
        required: true
        type: string
      AWS_REGION:
        required: false
        type: string
      AWS_ACCOUNT_ID:
        required: false
        type: string
      EKS_CLUSTER:
        required: false
        type: string
      zookeeperImageRepository:
        required: false
        type: string
        default: ""
      zookeeperImageTag:
        required: false
        type: string
        default: ""
      kafkaImageRepository:
        required: false
        type: string
        default: ""
      kafkaImageTag:
        required: false
        type: string
        default: ""
      kafkaUiImageRepository:
        required: false
        type: string
        default: ""
      kafkaUiImageTag:
        required: false
        type: string
        default: ""

permissions:
  id-token: write
  contents: read

env:
  HUB_ROLE_ARN: <<your specific value>>

jobs:
  deploy:
    name: Deploy Kafka + Zookeeper
    runs-on: [self-hosted, vmss]
    environment: ${{ inputs.environment }}-${{ inputs.cluster }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Export Config as Env Vars
        shell: bash
        run: |
          echo "ACR_NAME=${{ inputs.ACR_NAME }}" >> "$GITHUB_ENV"
          echo "BASE_REGISTRY=${{ inputs.BASE_REGISTRY }}" >> "$GITHUB_ENV"
          echo "AZURE_SUBSCRIPTION_ID=${{ inputs.AZURE_SUBSCRIPTION_ID }}" >> "$GITHUB_ENV"
          echo "RESOURCE_GROUP=${{ inputs.RESOURCE_GROUP }}" >> "$GITHUB_ENV"
          echo "AKS_CLUSTER=${{ inputs.AKS_CLUSTER }}" >> "$GITHUB_ENV"
          echo "KEY_VAULT_NAME=${{ inputs.KEY_VAULT_NAME }}" >> "$GITHUB_ENV"
          echo "NAMESPACE=${{ inputs.NAMESPACE }}" >> "$GITHUB_ENV"
          echo "ARM_SUBSCRIPTION_ID=${{ inputs.ARM_SUBSCRIPTION_ID }}" >> "$GITHUB_ENV"
          echo "AWS_REGION=${{ inputs.AWS_REGION }}" >> "$GITHUB_ENV"
          echo "AWS_ACCOUNT_ID=${{ inputs.AWS_ACCOUNT_ID }}" >> "$GITHUB_ENV"
          echo "EKS_CLUSTER=${{ inputs.EKS_CLUSTER }}" >> "$GITHUB_ENV"

      - name: Cloud Login
        uses: ./.github/actions/cloud-login
        with:
          cloud: ${{ inputs.cloud }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          aws-region: ${{ env.AWS_REGION }}
          aws-account-id: ${{ env.AWS_ACCOUNT_ID }}
          eks-cluster: ${{ env.EKS_CLUSTER }}

      - name: Verify Cluster Access
        shell: bash
        run: |
          set -euo pipefail

          helm ls -n "$NAMESPACE"
          kubectl get all -n "$NAMESPACE"

      - name: Deploy Kafka Stack
        shell: bash
        run: |
          set -euo pipefail

          CHART_DIR="dpn-health-monitoring/charts/kafka-stack"
          VALUES_FILE="$CHART_DIR/values/${{ inputs.cloud }}/${{ inputs.environment }}-${{ inputs.cluster }}.yaml"
          RELEASE_NAME="dpn-kafka-stack"

          echo "========================================"
          echo "Kafka deployment configuration"
          echo "========================================"
          echo "CHART_DIR=$CHART_DIR"
          echo "VALUES_FILE=$VALUES_FILE"
          echo "RELEASE_NAME=$RELEASE_NAME"

          if [ ! -d "$CHART_DIR" ]; then
            echo "Kafka chart directory missing: $CHART_DIR"
            exit 1
          fi

          if [ ! -f "$CHART_DIR/Chart.yaml" ]; then
            echo "Kafka Chart.yaml missing: $CHART_DIR/Chart.yaml"
            exit 1
          fi

          if [ ! -d "$CHART_DIR/templates" ]; then
            echo "Kafka templates directory missing: $CHART_DIR/templates"
            exit 1
          fi

          if [ ! -f "$CHART_DIR/templates/zookeeper-kafka.yaml" ]; then
            echo "Kafka/Zookeeper template missing: $CHART_DIR/templates/zookeeper-kafka.yaml"
            exit 1
          fi

          if [ ! -f "$CHART_DIR/templates/zookeeper-kafka-pvc.yaml" ]; then
            echo "Kafka PVC template missing: $CHART_DIR/templates/zookeeper-kafka-pvc.yaml"
            exit 1
          fi

          if [ ! -f "$CHART_DIR/templates/zookeeper-kafka-lb.yaml" ]; then
            echo "Kafka UI template missing: $CHART_DIR/templates/zookeeper-kafka-lb.yaml"
            exit 1
          fi

          if [ ! -f "$VALUES_FILE" ]; then
            echo "Kafka values file missing: $VALUES_FILE"
            echo "Available Kafka values files:"
            ls -la "$CHART_DIR" | grep "zookeeper-Kafka-values" || true
            exit 1
          fi

          EXTRA_ARGS=()
          if [ -n "${{ inputs.zookeeperImageRepository }}" ]; then
            EXTRA_ARGS+=(--set zookeeper.image.repository="<<your specific value>>/${{ inputs.zookeeperImageRepository }}")
          fi
          if [ -n "${{ inputs.zookeeperImageTag }}" ]; then
            EXTRA_ARGS+=(--set zookeeper.image.tag="${{ inputs.zookeeperImageTag }}")
          fi
          if [ -n "${{ inputs.kafkaImageRepository }}" ]; then
            EXTRA_ARGS+=(--set kafka.image.repository="<<your specific value>>/${{ inputs.kafkaImageRepository }}")
          fi
          if [ -n "${{ inputs.kafkaImageTag }}" ]; then
            EXTRA_ARGS+=(--set kafka.image.tag="${{ inputs.kafkaImageTag }}")
          fi
          if [ -n "${{ inputs.kafkaUiImageRepository }}" ]; then
            EXTRA_ARGS+=(--set kafkaUi.image.repository="<<your specific value>>/${{ inputs.kafkaUiImageRepository }}")
          fi
          if [ -n "${{ inputs.kafkaUiImageTag }}" ]; then
            EXTRA_ARGS+=(--set kafkaUi.image.tag="${{ inputs.kafkaUiImageTag }}")
          fi

          echo "========================================"
          echo "Linting Kafka chart"
          echo "========================================"

          helm lint "$CHART_DIR" \
            -f "$VALUES_FILE" \
            --set namespace="$NAMESPACE" \
            --set kafka.enabled=true \
            "${EXTRA_ARGS[@]}"

          echo "========================================"
          echo "Rendering Kafka + Zookeeper manifests"
          echo "========================================"

          helm template "$RELEASE_NAME" "$CHART_DIR" \
            --namespace "$NAMESPACE" \
            -f "$VALUES_FILE" \
            --set namespace="$NAMESPACE" \
            --set kafka.enabled=true \
            "${EXTRA_ARGS[@]}" \
            --debug > /tmp/kafka-zookeeper-rendered.yaml

          echo "Rendered resource kinds:"
          grep "^kind:" /tmp/kafka-zookeeper-rendered.yaml || true

          echo "========================================"
          echo "Checking expected rendered names"
          echo "========================================"

          grep -n "name: dpn-zookeeper-health" /tmp/kafka-zookeeper-rendered.yaml || true
          grep -n "name: dpn-kafka-health" /tmp/kafka-zookeeper-rendered.yaml || true
          grep -n "name: dpn-kafka-health-ui" /tmp/kafka-zookeeper-rendered.yaml || true

          echo "========================================"
          echo "Validating rendered resources"
          echo "========================================"

          if ! grep -q "name: dpn-zookeeper-health" /tmp/kafka-zookeeper-rendered.yaml; then
            echo "ERROR: dpn-zookeeper-health was not rendered."
            exit 1
          fi

          if ! grep -q "name: dpn-kafka-health" /tmp/kafka-zookeeper-rendered.yaml; then
            echo "ERROR: dpn-kafka-health was not rendered."
            exit 1
          fi

          if ! grep -q "name: dpn-kafka-health-ui" /tmp/kafka-zookeeper-rendered.yaml; then
            echo "ERROR: dpn-kafka-health-ui was not rendered."
            exit 1
          fi

          if grep -q "name: dpn-kafka-ui-health" /tmp/kafka-zookeeper-rendered.yaml; then
            echo "ERROR: Incorrect UI name dpn-kafka-ui-health found. Expected dpn-kafka-health-ui."
            exit 1
          fi

          if grep -q "name: dpn-kafka$" /tmp/kafka-zookeeper-rendered.yaml; then
            echo "ERROR: Old broker name dpn-kafka found. Expected dpn-kafka-health."
            exit 1
          fi

          if grep -q "name: dpn-zookeeper$" /tmp/kafka-zookeeper-rendered.yaml; then
            echo "ERROR: Old zookeeper name dpn-zookeeper found. Expected dpn-zookeeper-health."
            exit 1
          fi

          echo "========================================"
          echo "Checking Helm release status"
          echo "========================================"

          HELM_STATUS="$(helm status "$RELEASE_NAME" -n "$NAMESPACE" -o json 2>/dev/null | jq -r '.info.status' || echo not-found)"
          echo "Current Helm status: $HELM_STATUS"

          if echo "$HELM_STATUS" | grep -q "pending"; then
            echo "Helm release is stuck in $HELM_STATUS. Uninstalling..."
            helm uninstall "$RELEASE_NAME" -n "$NAMESPACE" || true
          fi

          echo "========================================"
          echo "Deploying Kafka + Zookeeper with Helm"
          echo "========================================"

          if [ "${{ inputs.cloud }}" = "aws" ]; then
            # NOTE: no --wait here. Long-lived Helm watches against the EKS
            # API from this runner are unreliable and time out even when the
            # rollout completes successfully on the cluster — see
            # certificate-manager-cd.yml. Poll rollout status separately below.
            helm upgrade --install "$RELEASE_NAME" "$CHART_DIR" \
              --namespace "$NAMESPACE" \
              -f "$VALUES_FILE" \
              --set namespace="$NAMESPACE" \
              --set kafka.enabled=true \
              "${EXTRA_ARGS[@]}" \
              --debug
          else
            helm upgrade --install "$RELEASE_NAME" "$CHART_DIR" \
              --namespace "$NAMESPACE" \
              -f "$VALUES_FILE" \
              --set namespace="$NAMESPACE" \
              --set kafka.enabled=true \
              "${EXTRA_ARGS[@]}" \
              --wait \
              --timeout 10m \
              --debug
          fi

          wait_for_rollout() {
            DEPLOYMENT="$1"
            if [ "${{ inputs.cloud }}" = "aws" ]; then
              ROLLOUT_OK=false
              for attempt in 1 2 3 4 5; do
                if kubectl rollout status deployment/"$DEPLOYMENT" -n "$NAMESPACE" --timeout=60s; then
                  ROLLOUT_OK=true
                  break
                fi
                echo "Rollout status attempt $attempt/5 for $DEPLOYMENT did not complete within 60s — retrying..."
                sleep 10
              done
              if [ "$ROLLOUT_OK" != "true" ]; then
                echo "::error::Deployment $DEPLOYMENT did not report ready after 5 attempts."
                exit 1
              fi
            else
              kubectl rollout status deployment/"$DEPLOYMENT" -n "$NAMESPACE" --timeout=300s
            fi
          }

          echo "========================================"
          echo "Waiting for Zookeeper rollout"
          echo "========================================"

          wait_for_rollout dpn-zookeeper-health

          echo "========================================"
          echo "Waiting for Kafka rollout"
          echo "========================================"

          wait_for_rollout dpn-kafka-health

          echo "========================================"
          echo "Waiting for Kafka UI rollout"
          echo "========================================"

          wait_for_rollout dpn-kafka-health-ui

          echo "========================================"
          echo "Kafka stack deployed successfully"
          echo "========================================"

          echo "Kafka/Zookeeper pods:"
          kubectl get pods -n "$NAMESPACE" | grep -E "kafka|zookeeper" || true

          echo "Kafka/Zookeeper services:"
          kubectl get svc -n "$NAMESPACE" | grep -E "kafka|zookeeper" || true

          echo "Kafka/Zookeeper endpoints:"
          kubectl get endpoints -n "$NAMESPACE" | grep -E "kafka|zookeeper" || true

          echo "Kafka deployment completed."
