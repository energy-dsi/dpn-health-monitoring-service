name: DPN CD - OTel Collector

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      cluster:
        required: true
        type: string
      cloud:
        required: true
        type: string
      ACR_NAME:
        required: true
        type: string
      BASE_REGISTRY:
        required: true
        type: string
      AZURE_SUBSCRIPTION_ID:
        required: true
        type: string
      RESOURCE_GROUP:
        required: true
        type: string
      AKS_CLUSTER:
        required: true
        type: string
      KEY_VAULT_NAME:
        required: true
        type: string
      NAMESPACE:
        required: true
        type: string
      ARM_SUBSCRIPTION_ID:
        required: true
        type: string
      imageTag:
        required: true
        type: string
      AWS_REGION:
        required: false
        type: string
      AWS_ACCOUNT_ID:
        required: false
        type: string
      EKS_CLUSTER:
        required: false
        type: string
      imageRepository:
        required: false
        type: string
        default: ""

permissions:
  id-token: write
  contents: read

env:
  HUB_ROLE_ARN: <<your specific value>>

jobs:
  deploy:
    name: Deploy OTel Collector Health
    runs-on: [self-hosted, vmss]
    environment: ${{ inputs.environment }}-${{ inputs.cluster }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Export Config as Env Vars
        shell: bash
        run: |
          echo "ACR_NAME=${{ inputs.ACR_NAME }}" >> "$GITHUB_ENV"
          echo "BASE_REGISTRY=${{ inputs.BASE_REGISTRY }}" >> "$GITHUB_ENV"
          echo "AZURE_SUBSCRIPTION_ID=${{ inputs.AZURE_SUBSCRIPTION_ID }}" >> "$GITHUB_ENV"
          echo "RESOURCE_GROUP=${{ inputs.RESOURCE_GROUP }}" >> "$GITHUB_ENV"
          echo "AKS_CLUSTER=${{ inputs.AKS_CLUSTER }}" >> "$GITHUB_ENV"
          echo "KEY_VAULT_NAME=${{ inputs.KEY_VAULT_NAME }}" >> "$GITHUB_ENV"
          echo "NAMESPACE=${{ inputs.NAMESPACE }}" >> "$GITHUB_ENV"
          echo "ARM_SUBSCRIPTION_ID=${{ inputs.ARM_SUBSCRIPTION_ID }}" >> "$GITHUB_ENV"
          echo "AWS_REGION=${{ inputs.AWS_REGION }}" >> "$GITHUB_ENV"
          echo "AWS_ACCOUNT_ID=${{ inputs.AWS_ACCOUNT_ID }}" >> "$GITHUB_ENV"
          echo "EKS_CLUSTER=${{ inputs.EKS_CLUSTER }}" >> "$GITHUB_ENV"

      - name: Cloud Login
        uses: ./.github/actions/cloud-login
        with:
          cloud: ${{ inputs.cloud }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          aws-region: ${{ env.AWS_REGION }}
          aws-account-id: ${{ env.AWS_ACCOUNT_ID }}
          eks-cluster: ${{ env.EKS_CLUSTER }}

      - name: Verify Cluster Access
        shell: bash
        run: |
          set -euo pipefail

          helm ls -n "$NAMESPACE"
          kubectl get all -n "$NAMESPACE"

      - name: Deploy OTel Collector Health
        shell: bash
        run: |
          set -euo pipefail

          HELM_DIR="dpn-health-monitoring/charts/otel-collector"
          VALUES_FILE="$HELM_DIR/values/${{ inputs.cloud }}/${{ inputs.environment }}-${{ inputs.cluster }}.yaml"
          RELEASE_NAME="dpn-otel-collector-health"
          FULLNAME_OVERRIDE="dpn-otel-collector-health"

          if [ "${{ inputs.cloud }}" = "aws" ]; then
            CLUSTER_NAME="$EKS_CLUSTER"
          else
            CLUSTER_NAME="$AKS_CLUSTER"
          fi

          echo "HELM_DIR=$HELM_DIR"
          echo "VALUES_FILE=$VALUES_FILE"
          echo "RELEASE_NAME=$RELEASE_NAME"
          echo "FULLNAME_OVERRIDE=$FULLNAME_OVERRIDE"

          if [ ! -d "$HELM_DIR" ]; then
            echo "OTel chart directory missing: $HELM_DIR"
            exit 1
          fi

          if [ ! -f "$HELM_DIR/Chart.yaml" ]; then
            echo "OTel Chart.yaml missing: $HELM_DIR/Chart.yaml"
            exit 1
          fi

          if [ ! -d "$HELM_DIR/templates" ]; then
            echo "OTel templates directory missing: $HELM_DIR/templates"
            exit 1
          fi

          if [ ! -f "$VALUES_FILE" ]; then
            echo "OTel values file missing: $VALUES_FILE"
            exit 1
          fi

          EXTRA_ARGS=()
          if [ -n "${{ inputs.imageRepository }}" ]; then
            EXTRA_ARGS+=(--set image.repository="<<your specific value>>/${{ inputs.imageRepository }}")
          fi

          echo "========================================"
          echo "Checking OTel dependencies..."
          echo "========================================"

          echo "Checking Kafka service..."
          kubectl get svc dpn-kafka-health -n "$NAMESPACE"

          echo "Checking Kafka endpoints..."
          if ! kubectl get endpoints dpn-kafka-health -n "$NAMESPACE" | grep -q ":9092"; then
            echo "Kafka endpoint dpn-kafka-health does not have ready backend on port 9092"
            kubectl get endpoints dpn-kafka-health -n "$NAMESPACE" || true
            exit 1
          fi

          echo "========================================"
          echo "Linting OTel chart..."
          echo "========================================"

          helm lint "$HELM_DIR" \
            -f "$VALUES_FILE" \
            --set fullnameOverride="$FULLNAME_OVERRIDE" \
            --set kafka.enabled=false \
            --set image.tag="${{ inputs.imageTag }}" \
            --set namespace="$NAMESPACE" \
            --set clusterName="$CLUSTER_NAME" \
            "${EXTRA_ARGS[@]}" \
            --debug

          echo "========================================"
          echo "Rendering OTel chart..."
          echo "========================================"

          helm template "$RELEASE_NAME" "$HELM_DIR" \
            --namespace "$NAMESPACE" \
            -f "$VALUES_FILE" \
            --set fullnameOverride="$FULLNAME_OVERRIDE" \
            --set kafka.enabled=false \
            --set image.tag="${{ inputs.imageTag }}" \
            --set namespace="$NAMESPACE" \
            --set clusterName="$CLUSTER_NAME" \
            "${EXTRA_ARGS[@]}" \
            --debug > /tmp/otel-rendered.yaml

          echo "Rendered resource kinds:"
          grep "^kind:" /tmp/otel-rendered.yaml || true

          echo "Checking rendered OTel name..."
          grep -n "name: dpn-otel-collector-health" /tmp/otel-rendered.yaml || true

          echo "Checking Kafka broker reference..."
          grep -n "dpn-kafka-health.ns-dpn-health-01.svc.cluster.local:9092" /tmp/otel-rendered.yaml || true

          echo "Ensuring Kafka/Zookeeper are NOT rendered by OTel health deployment..."
          if grep -q "name: dpn-kafka-health$" /tmp/otel-rendered.yaml; then
            echo "ERROR: Kafka broker resource rendered inside OTel health deployment."
            echo "Set kafka.enabled=false or remove Kafka templates from this release."
            exit 1
          fi

          if grep -q "name: dpn-zookeeper-health$" /tmp/otel-rendered.yaml; then
            echo "ERROR: Zookeeper resource rendered inside OTel health deployment."
            echo "Set kafka.enabled=false or remove Zookeeper templates from this release."
            exit 1
          fi

          echo "========================================"
          echo "Deploying OTel Collector Health..."
          echo "========================================"

          if [ "${{ inputs.cloud }}" = "aws" ]; then
            # NOTE: no --wait here. Long-lived Helm watches against the EKS
            # API from this runner are unreliable and time out even when the
            # rollout completes successfully on the cluster — see
            # certificate-manager-cd.yml. Poll rollout status separately below.
            helm upgrade --install "$RELEASE_NAME" "$HELM_DIR" \
              --namespace "$NAMESPACE" \
              -f "$VALUES_FILE" \
              --set fullnameOverride="$FULLNAME_OVERRIDE" \
              --set kafka.enabled=false \
              --set image.tag="${{ inputs.imageTag }}" \
              --set namespace="$NAMESPACE" \
              --set clusterName="$CLUSTER_NAME" \
              "${EXTRA_ARGS[@]}" \
              --debug
          else
            helm upgrade --install "$RELEASE_NAME" "$HELM_DIR" \
              --namespace "$NAMESPACE" \
              -f "$VALUES_FILE" \
              --set fullnameOverride="$FULLNAME_OVERRIDE" \
              --set kafka.enabled=false \
              --set image.tag="${{ inputs.imageTag }}" \
              --set namespace="$NAMESPACE" \
              --set clusterName="$CLUSTER_NAME" \
              "${EXTRA_ARGS[@]}" \
              --wait \
              --timeout 10m \
              --debug
          fi

          echo "========================================"
          echo "Waiting for OTel rollout..."
          echo "========================================"

          if [ "${{ inputs.cloud }}" = "aws" ]; then
            ROLLOUT_OK=false
            for attempt in 1 2 3 4 5; do
              if kubectl rollout status deployment/dpn-otel-collector-health -n "$NAMESPACE" --timeout=60s; then
                ROLLOUT_OK=true
                break
              fi
              echo "Rollout status attempt $attempt/5 did not complete within 60s — retrying..."
              sleep 10
            done
            if [ "$ROLLOUT_OK" != "true" ]; then
              echo "::error::Deployment dpn-otel-collector-health did not report ready after 5 attempts."
              exit 1
            fi
          else
            kubectl rollout status deployment/dpn-otel-collector-health \
              -n "$NAMESPACE" \
              --timeout=300s
          fi

          echo "========================================"
          echo "OTel resources:"
          echo "========================================"

          kubectl get pods -n "$NAMESPACE" | grep otel || true
          kubectl get svc -n "$NAMESPACE" | grep otel || true
          kubectl get endpoints -n "$NAMESPACE" | grep otel || true
          kubectl get deploy -n "$NAMESPACE" | grep otel || true
