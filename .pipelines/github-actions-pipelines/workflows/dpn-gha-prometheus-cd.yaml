name: DPN CD - Prometheus

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      cluster:
        required: true
        type: string
      cloud:
        required: true
        type: string
      ACR_NAME:
        required: true
        type: string
      BASE_REGISTRY:
        required: true
        type: string
      AZURE_SUBSCRIPTION_ID:
        required: true
        type: string
      RESOURCE_GROUP:
        required: true
        type: string
      AKS_CLUSTER:
        required: true
        type: string
      KEY_VAULT_NAME:
        required: true
        type: string
      NAMESPACE:
        required: true
        type: string
      ARM_SUBSCRIPTION_ID:
        required: true
        type: string
      AWS_REGION:
        required: false
        type: string
      AWS_ACCOUNT_ID:
        required: false
        type: string
      EKS_CLUSTER:
        required: false
        type: string
      prometheusImageRepository:
        required: false
        type: string
        default: ""
      prometheusImageTag:
        required: false
        type: string
        default: ""
      alertmanagerImageRepository:
        required: false
        type: string
        default: ""
      alertmanagerImageTag:
        required: false
        type: string
        default: ""
      kubeStateMetricsImageRepository:
        required: false
        type: string
        default: ""
      kubeStateMetricsImageTag:
        required: false
        type: string
        default: ""
      thanosSidecarImage:
        required: false
        type: string
        default: ""

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy Prometheus
    runs-on: [self-hosted, vmss]
    environment: ${{ inputs.environment }}-${{ inputs.cluster }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Export Config as Env Vars
        shell: bash
        run: |
          echo "ACR_NAME=${{ inputs.ACR_NAME }}" >> "$GITHUB_ENV"
          echo "BASE_REGISTRY=${{ inputs.BASE_REGISTRY }}" >> "$GITHUB_ENV"
          echo "AZURE_SUBSCRIPTION_ID=${{ inputs.AZURE_SUBSCRIPTION_ID }}" >> "$GITHUB_ENV"
          echo "RESOURCE_GROUP=${{ inputs.RESOURCE_GROUP }}" >> "$GITHUB_ENV"
          echo "AKS_CLUSTER=${{ inputs.AKS_CLUSTER }}" >> "$GITHUB_ENV"
          echo "KEY_VAULT_NAME=${{ inputs.KEY_VAULT_NAME }}" >> "$GITHUB_ENV"
          echo "NAMESPACE=${{ inputs.NAMESPACE }}" >> "$GITHUB_ENV"
          echo "ARM_SUBSCRIPTION_ID=${{ inputs.ARM_SUBSCRIPTION_ID }}" >> "$GITHUB_ENV"
          echo "AWS_REGION=${{ inputs.AWS_REGION }}" >> "$GITHUB_ENV"
          echo "AWS_ACCOUNT_ID=${{ inputs.AWS_ACCOUNT_ID }}" >> "$GITHUB_ENV"
          echo "EKS_CLUSTER=${{ inputs.EKS_CLUSTER }}" >> "$GITHUB_ENV"

      - name: Cloud Login
        uses: ./.github/actions/cloud-login
        with:
          cloud: ${{ inputs.cloud }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          aws-region: ${{ env.AWS_REGION }}
          aws-account-id: ${{ env.AWS_ACCOUNT_ID }}
          eks-cluster: ${{ env.EKS_CLUSTER }}

      - name: Verify Cluster Access
        shell: bash
        run: |
          set -euo pipefail

          helm ls -n "$NAMESPACE"
          kubectl get all -n "$NAMESPACE"

      - name: Deploy Prometheus
        shell: bash
        run: |
          set -euo pipefail

          VALUES_FILE="dpn-health-monitoring/charts/prometheus/values/${{ inputs.cloud }}/${{ inputs.environment }}-${{ inputs.cluster }}.yaml"
          RELEASE_NAME="dpn-prometheus"

          echo "VALUES_FILE=$VALUES_FILE"
          echo "RELEASE_NAME=$RELEASE_NAME"

          if [ ! -f "$VALUES_FILE" ]; then
            echo "Prometheus values file missing: $VALUES_FILE"
            exit 1
          fi

          echo "========================================"
          echo "Using vendored kube-prometheus-stack chart (airgapped — no external chart repo call)"
          echo "========================================"

          PROM_CHART="$GITHUB_WORKSPACE/dpn-health-monitoring/charts/prometheus"

          if [ ! -f "$PROM_CHART/Chart.yaml" ]; then
            echo "Vendored Prometheus chart missing: $PROM_CHART/Chart.yaml"
            echo "To refresh the vendored chart, run from a machine with internet access:"
            echo "  helm repo add prometheus-community https://prometheus-community.github.io/helm-charts"
            echo "  helm repo update"
            echo "  helm pull prometheus-community/kube-prometheus-stack --version <version> --untar --untardir /tmp/prom-pull"
            echo "  cp -r /tmp/prom-pull/kube-prometheus-stack/* dpn-health-monitoring/charts/prometheus/"
            echo "then commit the updated dpn-health-monitoring/charts/prometheus directory (Chart.yaml, templates/, charts/, values.yaml)."
            exit 1
          fi

          echo "Vendored chart version:"
          grep -E "^version:|^appVersion:" "$PROM_CHART/Chart.yaml" || true

          EXTRA_ARGS=()
          if [ -n "${{ inputs.prometheusImageRepository }}" ]; then
            EXTRA_ARGS+=(--set prometheus.prometheusSpec.image.repository="<<your specific value>>/${{ inputs.prometheusImageRepository }}")
          fi
          if [ -n "${{ inputs.prometheusImageTag }}" ]; then
            EXTRA_ARGS+=(--set prometheus.prometheusSpec.image.tag="${{ inputs.prometheusImageTag }}")
          fi
          if [ -n "${{ inputs.alertmanagerImageRepository }}" ]; then
            EXTRA_ARGS+=(--set alertmanager.alertmanagerSpec.image.repository="<<your specific value>>/${{ inputs.alertmanagerImageRepository }}")
          fi
          if [ -n "${{ inputs.alertmanagerImageTag }}" ]; then
            EXTRA_ARGS+=(--set alertmanager.alertmanagerSpec.image.tag="${{ inputs.alertmanagerImageTag }}")
          fi
          if [ -n "${{ inputs.kubeStateMetricsImageRepository }}" ]; then
            EXTRA_ARGS+=(--set kube-state-metrics.image.repository="<<your specific value>>/${{ inputs.kubeStateMetricsImageRepository }}")
          fi
          if [ -n "${{ inputs.kubeStateMetricsImageTag }}" ]; then
            EXTRA_ARGS+=(--set kube-state-metrics.image.tag="${{ inputs.kubeStateMetricsImageTag }}")
          fi
          if [ -n "${{ inputs.thanosSidecarImage }}" ]; then
            EXTRA_ARGS+=(--set prometheus.prometheusSpec.thanos.image="${{ inputs.thanosSidecarImage }}")
          fi

          echo "========================================"
          echo "Linting Prometheus chart..."
          echo "========================================"

          helm lint "$PROM_CHART" \
            -f "$VALUES_FILE" \
            --set prometheus-node-exporter.enabled=false \
            --set nodeExporter.enabled=false \
            "${EXTRA_ARGS[@]}"

          echo "========================================"
          echo "Rendering Prometheus chart..."
          echo "========================================"

          helm template "$RELEASE_NAME" "$PROM_CHART" \
            --namespace "$NAMESPACE" \
            -f "$VALUES_FILE" \
            --set prometheus-node-exporter.enabled=false \
            --set nodeExporter.enabled=false \
            "${EXTRA_ARGS[@]}" \
            --debug > /tmp/prometheus-rendered.yaml

          echo "Rendered Prometheus resource kinds:"
          grep "^kind:" /tmp/prometheus-rendered.yaml || true

          echo "Checking expected rendered names..."
          grep -n "dpn-prometheus" /tmp/prometheus-rendered.yaml | head -40 || true

          echo "Checking node-exporter DaemonSet is disabled..."

          if awk '
            /^kind: DaemonSet$/ { in_ds=1 }
            /^kind: / && $0 !~ /^kind: DaemonSet$/ { in_ds=0 }
            in_ds && /name: .*node-exporter/ { found=1 }
            END { exit found ? 0 : 1 }
          ' /tmp/prometheus-rendered.yaml; then
            echo "ERROR: node-exporter DaemonSet is still rendered."
            grep -n -A5 -B5 "node-exporter" /tmp/prometheus-rendered.yaml || true
            exit 1
          else
            echo "node-exporter DaemonSet is disabled."
          fi

          echo "========================================"
          echo "Checking Helm release status"
          echo "========================================"

          HELM_STATUS="$(helm status "$RELEASE_NAME" -n "$NAMESPACE" -o json 2>/dev/null | jq -r '.info.status' || echo not-found)"
          echo "Current Helm status: $HELM_STATUS"

          if [ "$HELM_STATUS" = "pending-install" ]; then
            echo "Helm release $RELEASE_NAME is stuck in pending-install."

            echo "Attempting Helm uninstall..."
            helm uninstall "$RELEASE_NAME" \
              -n "$NAMESPACE" \
              --wait \
              --timeout 10m || true

            HELM_STATUS_AFTER_UNINSTALL="$(helm status "$RELEASE_NAME" -n "$NAMESPACE" -o json 2>/dev/null | jq -r '.info.status' || echo not-found)"
            echo "Helm status after uninstall: $HELM_STATUS_AFTER_UNINSTALL"

            if [ "$HELM_STATUS_AFTER_UNINSTALL" != "not-found" ]; then
              echo "Helm release still exists. Deleting latest Helm release secret."

              PENDING_SECRET="$(kubectl get secret -n "$NAMESPACE" \
                -l owner=helm,name="$RELEASE_NAME" \
                -o json 2>/dev/null \
                | jq -r '.items[].metadata.name' \
                | sort -V \
                | tail -1 || true)"

              if [ -n "$PENDING_SECRET" ]; then
                echo "Deleting Helm secret: $PENDING_SECRET"
                kubectl delete secret "$PENDING_SECRET" -n "$NAMESPACE" || true
              else
                echo "No Helm release secret found for $RELEASE_NAME"
              fi
            fi

            echo "Cleaning Prometheus resources from failed pending install..."

            kubectl delete statefulset,deploy,daemonset,svc,job,cm,sa,role,rolebinding \
              -n "$NAMESPACE" \
              -l release="$RELEASE_NAME" \
              --ignore-not-found || true

            kubectl delete statefulset,deploy,daemonset,svc,job,cm,sa,role,rolebinding \
              -n "$NAMESPACE" \
              -l app.kubernetes.io/instance="$RELEASE_NAME" \
              --ignore-not-found || true
          fi

          if echo "$HELM_STATUS" | grep -q "pending-upgrade\|pending-rollback"; then
            echo "Helm release $RELEASE_NAME is stuck in $HELM_STATUS."

            echo "Helm history:"
            helm history "$RELEASE_NAME" -n "$NAMESPACE" || true

            LAST_DEPLOYED_REVISION="$(helm history "$RELEASE_NAME" -n "$NAMESPACE" -o json 2>/dev/null \
              | jq -r '[.[] | select(.status=="deployed")] | last | .revision // empty')"

            if [ -n "$LAST_DEPLOYED_REVISION" ]; then
              echo "Rolling back to last deployed revision: $LAST_DEPLOYED_REVISION"

              helm rollback "$RELEASE_NAME" "$LAST_DEPLOYED_REVISION" \
                -n "$NAMESPACE" \
                --wait \
                --timeout 10m || true
            else
              echo "No deployed revision found. Deleting latest Helm secret."

              PENDING_SECRET="$(kubectl get secret -n "$NAMESPACE" \
                -l owner=helm,name="$RELEASE_NAME" \
                -o json 2>/dev/null \
                | jq -r '.items[].metadata.name' \
                | sort -V \
                | tail -1 || true)"

              if [ -n "$PENDING_SECRET" ]; then
                echo "Deleting Helm secret: $PENDING_SECRET"
                kubectl delete secret "$PENDING_SECRET" -n "$NAMESPACE" || true
              fi
            fi
          fi

          echo "========================================"
          echo "Deploying Prometheus..."
          echo "========================================"

          if [ "${{ inputs.cloud }}" = "aws" ]; then
            # NOTE: no --wait/--atomic here. Long-lived Helm watches against
            # the EKS API from this runner are unreliable and time out even
            # when the rollout completes successfully on the cluster — see
            # certificate-manager-cd.yml. Poll rollout status separately below.
            helm upgrade --install "$RELEASE_NAME" "$PROM_CHART" \
              --namespace "$NAMESPACE" \
              -f "$VALUES_FILE" \
              --set prometheus-node-exporter.enabled=false \
              --set nodeExporter.enabled=false \
              "${EXTRA_ARGS[@]}" \
              --debug
          else
            helm upgrade --install "$RELEASE_NAME" "$PROM_CHART" \
              --namespace "$NAMESPACE" \
              -f "$VALUES_FILE" \
              --set prometheus-node-exporter.enabled=false \
              --set nodeExporter.enabled=false \
              "${EXTRA_ARGS[@]}" \
              --wait \
              --timeout 15m \
              --atomic \
              --debug
          fi

          echo "========================================"
          echo "Waiting for Prometheus workloads..."
          echo "========================================"

          wait_for_rollout() {
            KIND="$1"
            NAME="$2"
            TIMEOUT_S="$3"
            if [ "${{ inputs.cloud }}" = "aws" ]; then
              ROLLOUT_OK=false
              ATTEMPTS=$(( (TIMEOUT_S + 59) / 60 ))
              for attempt in $(seq 1 "$ATTEMPTS"); do
                if kubectl rollout status "$KIND/$NAME" -n "$NAMESPACE" --timeout=60s; then
                  ROLLOUT_OK=true
                  break
                fi
                echo "Rollout status attempt $attempt/$ATTEMPTS for $NAME did not complete within 60s — retrying..."
                sleep 10
              done
              if [ "$ROLLOUT_OK" != "true" ]; then
                echo "::error::$KIND/$NAME did not report ready after $ATTEMPTS attempts."
                exit 1
              fi
            else
              kubectl rollout status "$KIND/$NAME" -n "$NAMESPACE" --timeout="${TIMEOUT_S}s"
            fi
          }

          if kubectl get statefulset prometheus-dpn-prometheus-kube-promet-prometheus -n "$NAMESPACE" >/dev/null 2>&1; then
            wait_for_rollout statefulset prometheus-dpn-prometheus-kube-promet-prometheus 600
          else
            echo "Prometheus StatefulSet not found by expected name. Listing StatefulSets..."
            kubectl get statefulset -n "$NAMESPACE" | grep prometheus || true
          fi

          if kubectl get statefulset alertmanager-dpn-prometheus-kube-promet-alertmanager -n "$NAMESPACE" >/dev/null 2>&1; then
            wait_for_rollout statefulset alertmanager-dpn-prometheus-kube-promet-alertmanager 600
          else
            echo "Alertmanager StatefulSet not found by expected name. Listing StatefulSets..."
            kubectl get statefulset -n "$NAMESPACE" | grep alertmanager || true
          fi

          if kubectl get deployment dpn-prometheus-operator -n "$NAMESPACE" >/dev/null 2>&1; then
            wait_for_rollout deployment dpn-prometheus-operator 300
          else
            echo "Prometheus operator deployment not found. Listing deployments..."
            kubectl get deployment -n "$NAMESPACE" | grep prometheus || true
          fi

          echo "========================================"
          echo "Validating Prometheus health UI service..."
          echo "========================================"

          kubectl get svc dpn-prometheus-health-ui -n "$NAMESPACE"

          PROM_PORTS="$(kubectl get endpoints dpn-prometheus-health-ui \
            -n "$NAMESPACE" \
            -o jsonpath='{.subsets[*].ports[*].port}' 2>/dev/null || true)"

          echo "Prometheus health UI endpoint ports: $PROM_PORTS"

          if ! echo "$PROM_PORTS" | grep -wq "9090"; then
            echo "dpn-prometheus-health-ui has no ready backend on port 9090"

            kubectl get endpoints dpn-prometheus-health-ui \
              -n "$NAMESPACE" \
              -o yaml || true

            exit 1
          fi

          echo "Prometheus health UI endpoint validation passed."

          echo "========================================"
          echo "Prometheus resources:"
          echo "========================================"

          kubectl get pods -n "$NAMESPACE" | grep -E "prometheus|alertmanager" || true
          kubectl get svc -n "$NAMESPACE" | grep prometheus || true
          kubectl get svc -n "$NAMESPACE" | grep alertmanager || true
          kubectl get endpoints -n "$NAMESPACE" | grep prometheus || true
          kubectl get endpointslice -n "$NAMESPACE" | grep prometheus || true
          kubectl get statefulset -n "$NAMESPACE" | grep prometheus || true
          kubectl get deployment -n "$NAMESPACE" | grep prometheus || true
          kubectl get daemonset -n "$NAMESPACE" | grep prometheus || true
          kubectl get servicemonitor -n "$NAMESPACE" || true

          echo "========================================"
          echo "Testing Prometheus health endpoint..."
          echo "========================================"

          # Public image, not a GHCR mirror: kubectl run gives this pod no
          # imagePullSecret, so a private <<your specific value>>/* reference
          # fails ImagePullBackOff/401 with no way to authenticate. Same
          # public image dpn-cd-oauth2-proxy.yml's own ephemeral test pods
          # already use successfully.
          #
          # Port 9081, not 9090: dpn-prometheus-health-ui's Service now
          # publishes on 9081 (targetPort 9090) now that it's exposed
          # directly on the shared internal LB instead of through
          # oauth2-proxy-prometheus (see charts/oauth2-proxy/README.md —
          # that gateway has been retired; 9081 is the port it used to
          # publish). 9090 above only checks the endpoint's target port,
          # which is unaffected and still correct.
          kubectl run prometheus-curl-test \
            -n "$NAMESPACE" \
            --image=curlimages/curl:8.8.0 \
            --restart=Never \
            --rm \
            --attach \
            --command -- sh -c "curl -fsS -I --max-time 10 http://dpn-prometheus-health-ui:9081/-/healthy"

          echo "========================================"
          echo "Testing Prometheus ready endpoint..."
          echo "========================================"

          kubectl run prometheus-ready-curl-test \
            -n "$NAMESPACE" \
            --image=curlimages/curl:8.8.0 \
            --restart=Never \
            --rm \
            --attach \
            --command -- sh -c "curl -fsS -I --max-time 10 http://dpn-prometheus-health-ui:9081/-/ready"

          echo "========================================"
          echo "Recent Prometheus events:"
          echo "========================================"

          kubectl get events -n "$NAMESPACE" \
            --sort-by=.metadata.creationTimestamp | grep -i prometheus | tail -30 || true

          echo "Prometheus deployment completed."
